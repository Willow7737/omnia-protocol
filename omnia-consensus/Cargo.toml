[package]
name = "omnia-consensus"
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
rust-version = "1.88"

[dependencies]
omnia-primitives = { path = "../omnia-primitives" }
omnia-crypto = { path = "../omnia-crypto" }
redb = "2.0"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
getrandom = "0.4"
blake3 = "1.5"
subtle = "2.5"
hex = "0.4"
sha2 = "0.10"

[features]
default = []
persistent-storage = []

[dev-dependencies]
proptest = "1.4"
tempfile = "3"
