[package]
name = "omnia-benches"
version = { workspace = true }
edition = "2021"
license = "CC0-1.0"
publish = false

[dependencies]
omnia-primitives = { path = "../omnia-primitives" }
omnia-consensus = { path = "../omnia-consensus" }
omnia-crypto = { path = "../omnia-crypto" }
omnia-network = { path = "../omnia-network" }
omnia-economics = { path = "../economics" }
omnia-shards = { path = "../shards" }
omnia-binding = { path = "../binding" }
omnia-adapters = { path = "../omnia-adapters" }
omnia-node = { path = "../node" }
omnia-substrate = { path = "../substrate" }

criterion = { version = "0.5", features = ["html_reports"] }
iai-callgrind = "0.13"
tokio = { version = "1.38", features = ["full"] }
rand = "0.8"
postcard = { version = "1", features = ["alloc"] }

# ZK benchmark deps (feature-gated under 'full' to match omnia-adapters/arkworks)
ark-bn254 = { version = "0.4", optional = true }
ark-ff = { version = "0.5", optional = true }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "zk_benchmarks"
harness = false
required-features = ["full"]

[[bench]]
name = "hot_path_iai"
harness = false

[[bench]]
name = "baseline_bench"
harness = false

[[bench]]
name = "sharding_bench"
harness = false

[features]
default = []
full = ["omnia-node/full", "omnia-adapters/arkworks", "ark-bn254", "ark-ff"]
