# cargo-vet audits for Omnia Protocol
#
# This file records our own audit results for dependency crates.
# Each audit certifies that a specific version of a crate meets
# the specified criteria (safe-to-deploy, safe-to-run, etc.).
#
# Audits should be added after manually reviewing the crate's source
# code for:
# - Unsafe code usage and correctness
# - File system or network access
# - Use of environment variables or process spawning
# - Obfuscation or anti-analysis techniques
#
# For more information: https://mozilla.github.io/cargo-vet/

[[audits.omnia-substrate]]
who = "Omnia Protocol Contributors"
criteria = "safe-to-deploy"
version = "0.1.0"
notes = "Core substrate layer — our own code."

