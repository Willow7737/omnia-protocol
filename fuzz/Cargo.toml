[package]
name = "omnia-fuzz"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
omnia-substrate = { path = "../substrate" }
omnia-shards = { path = "../shards" }
omnia-binding = { path = "../binding" }
omnia-zk = { path = "../zk" }
omnia-economics = { path = "../economics" }
postcard = { version = "1", features = ["alloc"] }

[[bin]]
name = "fuzz_event_deserialization"
path = "fuzz_targets/fuzz_event_deserialization.rs"

[[bin]]
name = "fuzz_gossip_message"
path = "fuzz_targets/fuzz_gossip_message.rs"

[[bin]]
name = "fuzz_zk_proof_deserialization"
path = "fuzz_targets/fuzz_zk_proof_deserialization.rs"

[[bin]]
name = "fuzz_consensus_state_transition"
path = "fuzz_targets/fuzz_consensus_state_transition.rs"

[[bin]]
name = "fuzz_vector_clock_merge"
path = "fuzz_targets/fuzz_vector_clock_merge.rs"

[[bin]]
name = "fuzz_rate_limiter"
path = "fuzz_targets/fuzz_rate_limiter.rs"

[[bin]]
name = "fuzz_snapshot_deserialization"
path = "fuzz_targets/fuzz_snapshot_deserialization.rs"
