# Model checker configuration for OmniaCRDT.tla
#
# This configuration verifies the convergence properties of the three
# CRDT types used in the Omnia substrate: GCounter, OrSet, and LWWRegister.

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxVal = 3
    Elements = {e1, e2}
    MaxTags = 3

INVARIANTS
    TypeOK_GCounter
    TypeOK_OrSet
    TypeOK_LWW
    GCounterConvergence
    LWWConvergence

PROPERTIES
    GCounterCommutative
    GCounterIdempotent
    GCounterFinalConvergence
