\* Model bounds chosen for exhaustive TLC exploration in CI.
\*
\* The semilattice lemmas (merge commutativity/associativity/idempotence
\* for all three CRDTs) are named ASSUME statements — TLC evaluates them
\* once at startup over these bounded domains and refuses to run if any
\* is false; they need no entry here. The invariants below are checked
\* over the two-replica convergence state machine. The heaviest startup
\* lemma is GCounter associativity: ((MaxVal+1)^|Nodes|)^3 merge
\* evaluations = 27^3 with these bounds — instant.
SPECIFICATION Spec
INVARIANTS TypeOK TombstoneExclusion Converged
CONSTANTS Nodes = {n1, n2, n3}
          MaxVal = 2
          Elements = {e1, e2}
          MaxTags = 2
          MaxTs = 3
