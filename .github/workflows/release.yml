name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate & Sync Versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
          echo "Version: $VERSION"

      # release-please cannot reliably update Cargo.toml because our
      # version lives under [workspace.package] (nested TOML), which
      # breaks its JSONPath-based version extraction. So we sync here.
      # If any file is stale, we fix it, commit, and force-move the tag
      # so all downstream jobs (which checkout the tag) get the fix.
      - name: Sync all version files to release tag
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          CHANGED=0

          # --- Cargo.toml ---
          CURRENT=$(awk '
            /^\[workspace\.package\]/ { in_section=1; next }
            /^\[/ && in_section { exit }
            in_section && /^version[[:space:]]*=/ {
              gsub(/[" ]/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "::warning::Cargo.toml version ($CURRENT) -> $EXPECTED"
            sed -i "s/^version = \".*\"/version = \"$EXPECTED\"/" Cargo.toml
            CHANGED=1
          else
            echo "Cargo.toml confirmed: $EXPECTED"
          fi

          # --- Helm Chart.yaml ---
          CHART=$(awk '/^appVersion:/{gsub(/[^0-9.]/, "", $2); print $2; exit}' helm/omnia-node/Chart.yaml)
          if [ "$CHART" != "$EXPECTED" ]; then
            echo "::warning::Chart.yaml appVersion ($CHART) -> $EXPECTED"
            sed -i "s/^appVersion: \".*\"/appVersion: \"$EXPECTED\"/" helm/omnia-node/Chart.yaml
            CHANGED=1
          else
            echo "Chart.yaml confirmed: $EXPECTED"
          fi

          # --- Helm values.yaml ---
          VALUES=$(awk '/^  tag:/{gsub(/[^0-9.]/, "", $2); print $2; exit}' helm/omnia-node/values.yaml)
          if [ "$VALUES" != "$EXPECTED" ]; then
            echo "::warning::values.yaml image.tag ($VALUES) -> $EXPECTED"
            sed -i "s/^  tag: \".*\"/  tag: \"$EXPECTED\"/" helm/omnia-node/values.yaml
            CHANGED=1
          else
            echo "values.yaml confirmed: $EXPECTED"
          fi

          # Commit + force-move tag so downstream jobs pick up fixes.
          # This is safe: the tag was just created by release-please and
          # no one else has consumed it yet.
          if [ "$CHANGED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml helm/omnia-node/Chart.yaml helm/omnia-node/values.yaml
            git commit -m "chore: sync versions to $EXPECTED for release"
            TAG="${{ steps.version.outputs.tag }}"
            git tag -f "$TAG" HEAD
            git push origin "$TAG" --force
            echo "Tag $TAG moved to include version-sync commit"
          fi

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: omnia-node-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: omnia-node-aarch64-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: omnia-node-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: omnia-node-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: omnia-node-x86_64-windows
    steps:
      # fetch-depth 0 + ref ${{ needs.validate.outputs.tag }} ensures
      # we get the version-sync commit if validate job moved the tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-release-${{ matrix.target }}"

      # Belt-and-suspenders: sed the version even if validate synced it.
      # Also handles the case where validate didn't need to move the tag
      # (versions were already correct) but we still want to be sure.
      - name: Ensure version matches release tag
        shell: bash
        run: sed -i 's/^version = ".*"/version = "${{ needs.validate.outputs.version }}"/' Cargo.toml

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          export OPENSSL_VERSION=3.1.8
          curl -sL https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz | tar xz
          cd openssl-${OPENSSL_VERSION}
          ./Configure linux-aarch64 --prefix=/opt/openssl-arm64 \
            --cross-compile-prefix=aarch64-linux-gnu- \
            no-shared no-tests
          make -j$(nproc) && sudo make install_sw
          cd ..
          echo "OPENSSL_DIR=/opt/openssl-arm64" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=/opt/openssl-arm64/lib" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=/opt/openssl-arm64/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/opt/openssl-arm64/lib/pkgconfig" >> "$GITHUB_ENV"

      # No --locked: Cargo.toml version may differ from Cargo.lock after
      # the sed sync above. Without --locked, cargo uses the lockfile as
      # a guide but resolves workspace-member versions from Cargo.toml.
      # The Dockerfile already builds without --locked for the same reason.
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p omnia-node --no-default-features --features full

      - name: Verify binary size <= 17 MB (Linux x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          SIZE=$(stat --format="%s" target/${{ matrix.target }}/release/omnia-node)
          MAX=$((17 * 1024 * 1024))
          echo "Binary size: $SIZE bytes ($(( SIZE / 1024 / 1024 )) MB)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::Release binary exceeds 17 MB limit ($SIZE > $MAX)"
            exit 1
          fi
          echo "::notice::Release binary size check passed"

      - name: Prepare binary artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz omnia-node
          cd ../../..
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.sha256

      - name: Prepare binary artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/omnia-node.exe" -DestinationPath "${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact }}.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.sha256
          retention-days: 5
          if-no-files-found: warn

  build-contract:
    name: Compile Solidity Contract
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install solc
        run: |
          sudo add-apt-repository -y ppa:ethereum/ethereum
          sudo apt-get update
          sudo apt-get install -y solc

      - name: Compile OmniaRollup.sol
        run: |
          mkdir -p contract-output
          solc --combined-json abi,bin,metadata \
            --optimize --optimize-runs 200 \
            --overwrite \
            -o contract-output \
            omnia-adapters/contracts/ethereum/OmniaRollup.sol

          solc --abi \
            --optimize --optimize-runs 200 \
            -o contract-output \
            omnia-adapters/contracts/ethereum/OmniaRollup.sol

          solc --bin \
            --optimize --optimize-runs 200 \
            -o contract-output \
            omnia-adapters/contracts/ethereum/OmniaRollup.sol

          mv contract-output/OmniaRollup.abi contract-output/OmniaRollup.json 2>/dev/null || true
          mv contract-output/OmniaRollup.bin contract-output/OmniaRollup.bin.txt 2>/dev/null || true

          VERSION="${{ needs.validate.outputs.version }}"
          python3 -c "
          import json, os
          combined_path = 'contract-output/combined.json'
          if os.path.exists(combined_path):
              with open(combined_path) as f:
                  data = json.load(f)
              contracts = data.get('contracts', {})
              for key, val in contracts.items():
                  if 'OmniaRollup' in key:
                      artifact = {
                          'contractName': 'OmniaRollup',
                          'version': '$VERSION',
                          'abi': json.loads(val.get('abi', '[]')) if isinstance(val.get('abi'), str) else val.get('abi', []),
                          'bytecode': val.get('bin', ''),
                          'metadata': val.get('metadata', ''),
                          'compiler': {
                              'version': '0.8.19+commit.7dd6d6e4',
                              'optimization': True,
                              'runs': 200
                          }
                      }
                      with open('contract-output/OmniaRollup-artifact.json', 'w') as out:
                          json.dump(artifact, out, indent=2)
                      break
          "

      - name: Compute contract checksums
        run: |
          sha256sum contract-output/* > contract-output/checksums.txt
          cat contract-output/checksums.txt

      - name: Upload contract artifact
        uses: actions/upload-artifact@v5
        with:
          name: omnia-rollup-contract
          path: contract-output/
          retention-days: 5

  generate-sbom:
    name: Generate SBOM
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-release-sbom"

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: |
          mkdir -p sbom-output
          cargo cyclonedx --all --format json
          cargo cyclonedx --all --format xml
          find . -name '*.bom.json' -exec mv {} sbom-output/ \; 2>/dev/null || true
          find . -name '*.bom.xml' -exec mv {} sbom-output/ \; 2>/dev/null || true

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: omnia-release-sbom
          path: sbom-output/
          retention-days: 5

  security-audit:
    name: Security Audit
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"

      - name: Run cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --json > audit-report.json 2>/dev/null
          cargo audit --deny unmaintained \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0437 \
            --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2026-0173

      - name: Upload audit report
        uses: actions/upload-artifact@v5
        with:
          name: security-audit
          path: audit-report.json
          retention-days: 30

  docker-image:
    name: Build & Push Docker Image
    needs: [validate, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.tag }}

      # Belt-and-suspenders: ensure Cargo.toml version is correct
      # before Docker build. The Dockerfile deletes and regenerates
      # Cargo.lock internally, but CARGO_PKG_VERSION comes from Cargo.toml.
      - name: Ensure version matches release tag
        run: sed -i 's/^version = ".*"/version = "${{ needs.validate.outputs.version }}"/' Cargo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="${{ needs.validate.outputs.tag }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repo_lower=$REPO_LOWER" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/$REPO_LOWER/omnia-node:$VERSION,ghcr.io/$REPO_LOWER/omnia-node:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Omnia Node
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ needs.validate.outputs.version }}

  publish-release:
    name: Publish GitHub Release
    needs:
      - validate
      - build-binaries
      - build-contract
      - generate-sbom
      - security-audit
      - docker-image
    runs-on: ubuntu-latest
    if: always() && needs.validate.result == 'success' && needs.build-binaries.result == 'success' && needs.build-contract.result == 'success' && needs.docker-image.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - name: Download binary artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts/
          pattern: omnia-node-*
          merge-multiple: false

      - name: Download contract artifact
        uses: actions/download-artifact@v5
        with:
          name: omnia-rollup-contract
          path: release-artifacts/omnia-rollup-contract/

      - name: Download security audit
        uses: actions/download-artifact@v5
        with:
          name: security-audit
          path: release-artifacts/security-audit/

      - name: Download SBOM
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: omnia-release-sbom
          path: release-artifacts/omnia-release-sbom/

      - name: Consolidate release files
        run: |
          mkdir -p release-files
          find release-artifacts/ -name '*.tar.gz' -exec mv {} release-files/ \; 2>/dev/null || true
          find release-artifacts/ -name '*.zip' -exec mv {} release-files/ \; 2>/dev/null || true
          find release-artifacts/ -name '*.sha256' -exec mv {} release-files/ \; 2>/dev/null || true
          mkdir -p release-files/contract
          find release-artifacts/omnia-rollup-contract/ -type f -exec mv {} release-files/contract/ \; 2>/dev/null || true
          mkdir -p release-files/sbom
          find release-artifacts/omnia-release-sbom/ -type f -exec mv {} release-files/sbom/ \; 2>/dev/null || true
          find release-artifacts/security-audit/ -name 'audit-report.json' -exec mv {} release-files/ \; 2>/dev/null || true
          echo "=== Release files ==="
          find release-files/ -type f | sort

      - name: Generate comprehensive checksums
        run: |
          cd release-files
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS
          else
            echo "No archive files found for checksumming" > SHA256SUMS
          fi
          echo "=== Checksums ==="
          cat SHA256SUMS

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Omnia Protocol ${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## Omnia Protocol ${{ needs.validate.outputs.tag }}

            ### Binaries
            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x86_64 | `omnia-node-x86_64-linux.tar.gz` |
            | Linux | ARM64 | `omnia-node-aarch64-linux.tar.gz` |
            | macOS | x86_64 | `omnia-node-x86_64-macos.tar.gz` |
            | macOS | ARM64 (Apple Silicon) | `omnia-node-aarch64-macos.tar.gz` |
            | Windows | x86_64 | `omnia-node-x86_64-windows.zip` |

            ### Smart Contract
            - `contract/OmniaRollup-artifact.json` — Combined ABI + bytecode + metadata (v${{ needs.validate.outputs.version }})
            - `contract/OmniaRollup.json` — ABI only
            - `contract/OmniaRollup.bin.txt` — Bytecode only
            - `contract/checksums.txt` — Contract file checksums

            ### Supply Chain
            - `sbom/` — CycloneDX Software Bill of Materials (JSON + XML)
            - `audit-report.json` — `cargo audit` security report
            - `SHA256SUMS` — Checksums for all binary archives

            ### Docker
            ```
            docker pull ghcr.io/willow7737/omnia-node:${{ needs.validate.outputs.version }}
            ```

            ### Verification
            ```bash
            sha256sum -c SHA256SUMS
            cat contract/checksums.txt
            ```

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ needs.validate.outputs.tag }}
          files: |
            release-files/*.tar.gz
            release-files/*.zip
            release-files/*.sha256
            release-files/SHA256SUMS
            release-files/contract/*
            release-files/sbom/*
            release-files/audit-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
