name: Benchmark Regression Gate (Self-Hosted)

# Runs benchmarks on a self-hosted runner with stable CPU affinity.
# This is the production-grade benchmark gate that addresses the
# ±20-30% inter-run variance inherent to GitHub Actions shared runners.
#
# PREREQUISITE: A self-hosted runner must be registered with the
# 'benchmark' label. See docs/operations/self-hosted-runner-setup.md
# for setup instructions (Ubuntu 22.04+, dedicated physical CPU cores,
# CPU governor pinned to 'performance', ASLR disabled for deterministic
# memory layout).
#
# This workflow runs ONLY:
#   - On manual trigger (workflow_dispatch) — for pre-merge validation
#   - On pushes to main — for release-grade gating
#
# The self-hosted runner label 'benchmark' must be configured per the
# setup docs. If no runner with this label is online, the job will
# queue until one becomes available (no fallback to shared runners —
# that would reintroduce the variance this workflow exists to eliminate).

on:
  push:
    branches: [main]
    paths:
      - 'omnia-consensus/**'
      - 'omnia-crypto/**'
      - 'omnia-network/**'
      - 'omnia-adapters/**'
      - 'omnia-primitives/**'
      - 'benches/**'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Multi-sample runs (default: 10 — self-hosted runners are stable enough for 10+)'
        required: false
        default: '10'
      threshold:
        description: 'Regression threshold % (default: 5 — tight because self-hosted variance is <3%)'
        required: false
        default: '5'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ── Pre-flight check: verify the self-hosted runner is online ────
  # If this job fails, the downstream bench jobs will queue indefinitely.
  # Fail fast with a clear error message instead.
  preflight:
    name: Verify Self-Hosted Runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check runner availability
        run: |
          echo "Self-hosted runner with label 'benchmark' is required."
          echo "If this job is the only one running, the runner is OFFLINE."
          echo "See docs/operations/self-hosted-runner-setup.md for setup."
          echo ""
          echo "To check runner status:"
          echo "  gh api repos/${{ github.repository }}/actions/runners --jq '.runners[] | select(.labels[].name==\"benchmark\")'"
        continue-on-error: true

  # ── Criterion benchmarks with multi-sample significance ─────────
  criterion-self-hosted:
    name: Criterion (Self-Hosted, N=${{ github.event.inputs.runs || '10' }})
    needs: preflight
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (if not cached on runner)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"

      # Self-hosted runner setup script (idempotent — safe to re-run).
      # Pins CPU governor, disables ASLR, installs valgrind.
      - name: Ensure runner environment
        run: |
          bash scripts/setup-benchmark-runner.sh

      # Multi-sample gate with N=10 (self-hosted variance is <3%, so
      # 10 runs gives a tight CI). Threshold defaults to 5% (vs 10%
      # on shared runners) because there's no noise to tolerate.
      - name: Multi-sample significance gate (throughput)
        run: |
          python3 scripts/multi_sample_bench.py \
            --runs ${{ github.event.inputs.runs || '10' }} \
            --bench throughput \
            --baselines benches/baselines.json \
            --threshold ${{ github.event.inputs.threshold || '5' }} \
            --output self_hosted_throughput_results.txt 2>&1 | tee self_hosted_gate.txt

      - name: Multi-sample significance gate (baseline_bench)
        run: |
          python3 scripts/multi_sample_bench.py \
            --runs ${{ github.event.inputs.runs || '10' }} \
            --bench baseline_bench \
            --baselines benches/baselines.json \
            --threshold ${{ github.event.inputs.threshold || '5' }} \
            --output self_hosted_baseline_results.txt 2>&1 | tee -a self_hosted_gate.txt
        continue-on-error: true

      - name: Upload self-hosted results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: self-hosted-bench-results
          path: |
            self_hosted_gate.txt
            self_hosted_throughput_results.txt
            self_hosted_baseline_results.txt
          retention-days: 90

  # ── IAI instruction-count gate (deterministic) ──────────────────
  # On a self-hosted runner with ASLR disabled, IAI counts are perfectly
  # reproducible. Threshold is 1% (vs 2% on shared runners) — any
  # change >1% in instruction count is a real code-path change.
  iai-self-hosted:
    name: IAI-Callgrind (Self-Hosted, deterministic)
    needs: preflight
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"

      - name: Ensure runner environment
        run: bash scripts/setup-benchmark-runner.sh

      - name: Build IAI benchmarks
        run: cargo bench -p omnia-benches --bench hot_path_iai --no-run

      - name: Run IAI benchmarks
        run: |
          cargo bench -p omnia-benches --bench hot_path_iai 2>&1 | tee iai_output.txt

      - name: IAI regression gate (1% threshold)
        run: |
          python3 scripts/check_iai_regression.py \
            --baselines benches/iai_baselines.json \
            --threshold 1.0 \
            iai_output.txt 2>&1 | tee iai_regression_gate.txt

      - name: Upload IAI results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: self-hosted-iai-results
          path: |
            iai_output.txt
            iai_regression_gate.txt
          retention-days: 90

  # ── ZK benchmarks (self-hosted, can run reliably here) ──────────
  zk-self-hosted:
    name: ZK Benchmarks (Self-Hosted)
    needs: preflight
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 60
    if: ${{ github.event.inputs.run_zk != 'false' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"

      - name: Ensure runner environment
        run: bash scripts/setup-benchmark-runner.sh

      # ZK benchmarks with multi-sample on a self-hosted runner.
      # The self-hosted runner's stable allocator state reduces the
      # ~10-15% Groth16 allocator variance to <5%, so multi-sample
      # significance testing actually works here.
      - name: Multi-sample ZK gate
        run: |
          python3 scripts/multi_sample_bench.py \
            --runs ${{ github.event.inputs.runs || '10' }} \
            --bench zk_benchmarks \
            --features full \
            --baselines benches/baselines.json \
            --threshold ${{ github.event.inputs.threshold || '5' }} \
            --output self_hosted_zk_results.txt 2>&1 | tee self_hosted_zk_gate.txt
        continue-on-error: true  # ZK benches are flaky even on self-hosted

      - name: Upload ZK results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: self-hosted-zk-results
          path: |
            self_hosted_zk_gate.txt
            self_hosted_zk_results.txt
          retention-days: 90
