name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-ci"
      - run: cargo fmt --all -- --check
      - name: Clippy (lib code — deny unwrap_used)
        run: cargo clippy --lib --workspace --exclude omnia-fuzz -- -D warnings -D clippy::unwrap_used
      - name: Clippy (all targets — deny unwrap_used in test code too)
        run: cargo clippy --all-targets --workspace --exclude omnia-fuzz -- -D clippy::unwrap_used
      - run: cargo doc --workspace --no-deps --exclude omnia-fuzz
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Verify exemption notes
        run: |
          python3 -c "
          import sys
          # Parse TOML without external dependency
          with open('supply-chain/config.toml') as f:
              content = f.read()
          # Simple check: every exemption block should have a notes field
          in_exemption = False
          has_notes = False
          current_name = ''
          missing = []
          for line in content.splitlines():
              stripped = line.strip()
              if stripped.startswith('[[') and 'exemptions' in stripped:
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = True
                  has_notes = False
                  current_name = stripped
              elif in_exemption and stripped.startswith('notes'):
                  has_notes = True
              elif stripped.startswith('[[') or stripped.startswith('['):
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = False
          if in_exemption and not has_notes:
              missing.append(current_name)
          if missing:
              print(f'Missing notes for {len(missing)} exemptions')
              sys.exit(1)
          print('All exemptions have notes')
          "
      - name: Check Prettier formatting
        run: |
          npm install -g prettier
          npx prettier --check "**/*.md" "**/*.json" "!**/node_modules/**" "!target/**" "!**/Cargo.lock" "!supply-chain/**"
        continue-on-error: true  # Existing files not yet Prettier-formatted

  feature-matrix:
    name: Feature Matrix (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--features full"
          - "--features light"
          - "--no-default-features"
          - "--no-default-features --features full"
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-feature-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.features }}"
      - name: Check with ${{ matrix.features || 'default' }}
        run: cargo check -p omnia-node ${{ matrix.features }}
      - name: Test with ${{ matrix.features || 'default' }}
        run: cargo test -p omnia-node ${{ matrix.features }}

  test:
    name: Test (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting Homebrew rustup (macOS)
        if: runner.os == 'macOS'
        run: |
          brew unlink rustup 2>/dev/null || true
          rm -f /usr/local/bin/cargo /opt/homebrew/bin/cargo
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - name: Verify cargo works
        run: |
          cargo --version
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-test-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}"
      - name: Verify Cargo.lock is up to date
        run: cargo test --locked --workspace --exclude omnia-fuzz --no-run
      - run: cargo test --workspace --exclude omnia-fuzz --verbose
        timeout-minutes: 15
      - run: cargo test --workspace --exclude omnia-fuzz --all-features --verbose
        timeout-minutes: 15

  chaos-critical:
    name: Critical Chaos Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-chaos"
      - name: Run crash recovery chaos test
        run: cargo test -p omnia-chaos-tests --test crash_recovery --verbose
        timeout-minutes: 10
      - name: Run byzantine chaos test
        run: cargo test -p omnia-chaos-tests --test byzantine --verbose
        timeout-minutes: 10

  binary-size:
    name: Release Binary Size Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-release-size"
      - name: Build release binary (production profile)
        run: cargo build -p omnia-node --release --no-default-features --features full
        timeout-minutes: 20
      - name: Verify binary size ≤ 12 MB
        run: |
          SIZE=$(stat --format="%s" target/release/omnia-node)
          MAX=$((12 * 1024 * 1024))  # 12,582,912 bytes
          echo "Binary size: $SIZE bytes ($(( SIZE / 1024 / 1024 )) MB)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::Binary size $SIZE exceeds 12 MB limit ($MAX bytes)"
            exit 1
          fi
          echo "::notice::Binary size check passed: $SIZE bytes ≤ $MAX bytes"

  msrv:
    name: MSRV Check (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-msrv"
      - name: Check workspace compiles with MSRV
        run: cargo +1.88.0 check --workspace --exclude omnia-fuzz --exclude omnia-chaos-tests --exclude omnia-benches
      - name: Verify MSRV with cargo-msrv
        run: |
          cargo install cargo-msrv --locked
          cargo msrv verify --workspace --exclude omnia-fuzz --exclude omnia-chaos-tests --exclude omnia-benches --min 1.88.0
        continue-on-error: true  # cargo-msrv may drift with new dep requirements

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings --ignore RUSTSEC-2023-0079 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2024-0437 --ignore RUSTSEC-2025-0055 --ignore RUSTSEC-2025-0057 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny check

  udeps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-udeps"
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - name: Check for unused dependencies
        run: cargo udeps --workspace --all-features --exclude omnia-fuzz

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-mutants"
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutation testing on core crates (primitives + consensus only)
        run: cargo mutants --in-place -p omnia-primitives -p omnia-consensus --check --timeout 300
        timeout-minutes: 30
        continue-on-error: true  # Report score but don't block CI

  benchmark-comparison:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-bench-${{ hashFiles('**/Cargo.lock') }}"
      - name: Build benchmarks
        run: cargo bench --no-run -p omnia-benches --features full
      - name: Run quick benchmark (5s per group)
        run: cargo bench -p omnia-benches --features full -- --quick --save-baseline main
        timeout-minutes: 10
        continue-on-error: true  # Benchmarks are informational

  supply-chain:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      - name: Run cargo-vet
        run: cargo vet
        continue-on-error: true  # Track progress without blocking CI
      - name: Verify exemption notes
        run: |
          python3 -c "
          import sys
          with open('supply-chain/config.toml') as f:
              content = f.read()
          in_exemption = False
          has_notes = False
          current_name = ''
          missing = []
          for line in content.splitlines():
              stripped = line.strip()
              if stripped.startswith('[[') and 'exemptions' in stripped:
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = True
                  has_notes = False
                  current_name = stripped
              elif in_exemption and stripped.startswith('notes'):
                  has_notes = True
              elif stripped.startswith('[[') or stripped.startswith('['):
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = False
          if in_exemption and not has_notes:
              missing.append(current_name)
          if missing:
              print(f'Missing notes for {len(missing)} exemptions')
              sys.exit(1)
          print('All exemptions have notes')
          "

  reproducibility:
    name: Build Reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build #1
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          RUSTFLAGS="-C link-arg=-Wl,--build-id=none" \
            cargo build --release --locked --target x86_64-unknown-linux-gnu -p omnia-node --no-default-features --features full
          sha256sum target/x86_64-unknown-linux-gnu/release/omnia-node > /tmp/build1.sha
      - name: Clean and rebuild
        run: |
          cargo clean
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          RUSTFLAGS="-C link-arg=-Wl,--build-id=none" \
            cargo build --release --locked --target x86_64-unknown-linux-gnu -p omnia-node --no-default-features --features full
          sha256sum target/x86_64-unknown-linux-gnu/release/omnia-node > /tmp/build2.sha
      - name: Compare builds
        run: |
          if diff /tmp/build1.sha /tmp/build2.sha; then
            echo "::notice::Reproducible build confirmed"
          else
            echo "::warning::Builds are not reproducible — known Rust/LLVM non-determinism"
          fi

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-coverage"
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --exclude omnia-fuzz --lcov --output-path lcov.info
      - name: Generate coverage summary
        run: cargo llvm-cov --workspace --exclude omnia-fuzz --summary-only 2>&1 | tee coverage-summary.txt
      - uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt
          retention-days: 30

  fuzz-smoke:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Override toolchain for fuzz
        run: rustup override set nightly
      - name: Install cargo-fuzz
        run: |
          if ! cargo install cargo-fuzz 2>/dev/null; then
            echo "::warning::cargo-fuzz install failed on latest nightly; trying nightly-2026-03-15"
            rustup toolchain install nightly-2026-03-15 --component rust-src
            rustup override set nightly-2026-03-15
            cargo install cargo-fuzz --locked
          fi
      - name: Build fuzz targets
        run: cargo fuzz build --fuzz-dir fuzz
      - name: Smoke test each target (10s each)
        run: |
          TARGETS=(
            fuzz_event_deserialization
            fuzz_gossip_message
            fuzz_zk_proof_deserialization
            fuzz_consensus_state_transition
            fuzz_vector_clock_merge
            fuzz_rate_limiter
            fuzz_snapshot_deserialization
            fuzz_primitives_event
          )
          for target in "${TARGETS[@]}"; do
            echo "--- Smoke testing $target ---"
            timeout 10 cargo fuzz run "$target" --fuzz-dir fuzz -- -runs=1000 2>&1 || {
              echo "Fuzz target $target crashed!"
              exit 1
            }
            echo "$target smoke test passed"
          done

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: |
          mkdir -p sbom
          cargo cyclonedx --all --format json
          cargo cyclonedx --all --format xml
          find . -name '*.bom.json' -exec mv {} sbom/ \; || true
          find . -name '*.bom.xml' -exec mv {} sbom/ \; || true
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnia-sbom
          path: sbom/
          retention-days: 90
      - name: Verify SBOM completeness
        run: |
          CRATES="omnia-primitives omnia-consensus omnia-crypto omnia-network omnia-adapters omnia-shards omnia-binding omnia-economics omnia-node"
          found=0
          total=0
          for crate in $CRATES; do
            total=$((total + 1))
            if ls sbom/${crate}*.json 2>/dev/null; then
              found=$((found + 1))
            else
              echo "Warning: Missing SBOM for $crate"
            fi
          done
          echo "Found SBOM for $found/$total crates"
          if [ "$found" -eq 0 ]; then
            echo "No SBOM files found — check cargo-cyclonedx output format"
            ls -la sbom/ || true
          fi
