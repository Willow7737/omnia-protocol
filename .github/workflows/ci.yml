name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-ci"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude omnia-fuzz -- -D warnings
      - run: cargo doc --workspace --no-deps --exclude omnia-fuzz
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Test (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting Homebrew rustup (macOS)
        if: runner.os == 'macOS'
        run: |
          # The macOS runner ships a Homebrew rustup whose 'cargo' wrapper
          # is actually rustup-init and cannot proxy subcommands like
          # 'cargo test'.  Remove it so dtolnay/rust-toolchain can install
          # its own working rustup without conflicts.
          brew unlink rustup 2>/dev/null || true
          rm -f /usr/local/bin/cargo /opt/homebrew/bin/cargo
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - name: Verify cargo works
        run: |
          cargo --version
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-test-${{ matrix.os }}"
      - name: Verify Cargo.lock is up to date
        run: cargo test --locked --workspace --exclude omnia-fuzz --no-run
      - run: cargo test --workspace --exclude omnia-fuzz --verbose
        timeout-minutes: 15
      - run: cargo test --workspace --exclude omnia-fuzz --all-features --verbose
        timeout-minutes: 15

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  supply-chain:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      - name: Run cargo-vet
        run: cargo vet

  reproducibility:
    name: Build Reproducibility
    runs-on: ubuntu-latest
    continue-on-error: true  # Rust builds are not yet fully deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build #1
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          RUSTFLAGS="-C link-arg=-Wl,--build-id=none" \
            cargo build --release --locked --target x86_64-unknown-linux-gnu
          sha256sum target/x86_64-unknown-linux-gnu/release/omnia-node > /tmp/build1.sha
      - name: Clean and rebuild
        run: |
          cargo clean
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          RUSTFLAGS="-C link-arg=-Wl,--build-id=none" \
            cargo build --release --locked --target x86_64-unknown-linux-gnu
          sha256sum target/x86_64-unknown-linux-gnu/release/omnia-node > /tmp/build2.sha
      - name: Compare builds
        run: |
          if diff /tmp/build1.sha /tmp/build2.sha; then
            echo "::notice::Reproducible build confirmed"
          else
            echo "::warning::Builds are not reproducible — known Rust/LLVM non-determinism"
          fi

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-tarpaulin --locked
      - run: cargo tarpaulin --workspace --exclude omnia-fuzz --out Xml --out Html
      - uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            tarpaulin-report.html
            cobertura.xml
          retention-days: 30
