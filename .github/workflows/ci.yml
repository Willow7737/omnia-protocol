name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-ci"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude omnia-fuzz -- -D warnings
      - run: cargo doc --workspace --no-deps --exclude omnia-fuzz
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Verify exemption notes
        run: |
          python3 -c "
          import sys
          # Parse TOML without external dependency
          with open('supply-chain/config.toml') as f:
              content = f.read()
          # Simple check: every exemption block should have a notes field
          in_exemption = False
          has_notes = False
          current_name = ''
          missing = []
          for line in content.splitlines():
              stripped = line.strip()
              if stripped.startswith('[[') and 'exemptions' in stripped:
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = True
                  has_notes = False
                  current_name = stripped
              elif in_exemption and stripped.startswith('notes'):
                  has_notes = True
              elif stripped.startswith('[[') or stripped.startswith('['):
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = False
          if in_exemption and not has_notes:
              missing.append(current_name)
          if missing:
              print(f'❌ Missing notes for {len(missing)} exemptions')
              sys.exit(1)
          print('✅ All exemptions have notes')
          "
      - name: Check Prettier formatting
        run: |
          npm install -g prettier
          npx prettier --check "**/*.md" "**/*.json" "!**/node_modules/**" "!target/**"

  test:
    name: Test (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting Homebrew rustup (macOS)
        if: runner.os == 'macOS'
        run: |
          # The macOS runner ships a Homebrew rustup whose 'cargo' wrapper
          # is actually rustup-init and cannot proxy subcommands like
          # 'cargo test'.  Remove it so dtolnay/rust-toolchain can install
          # its own working rustup without conflicts.
          brew unlink rustup 2>/dev/null || true
          rm -f /usr/local/bin/cargo /opt/homebrew/bin/cargo
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - name: Verify cargo works
        run: |
          cargo --version
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-test-${{ matrix.os }}"
      - name: Verify Cargo.lock is up to date
        run: cargo test --locked --workspace --exclude omnia-fuzz --no-run
      - run: cargo test --workspace --exclude omnia-fuzz --verbose
        timeout-minutes: 15
      - run: cargo test --workspace --exclude omnia-fuzz --all-features --verbose
        timeout-minutes: 15

  chaos-critical:
    name: Critical Chaos Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-chaos"
      - name: Run crash recovery chaos test
        run: cargo test -p omnia-chaos-tests --test crash_recovery --verbose
        timeout-minutes: 10
      - name: Run byzantine chaos test
        run: cargo test -p omnia-chaos-tests --test byzantine --verbose
        timeout-minutes: 10

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny check

  supply-chain:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    # Blocking: supply-chain audit failures now fail the CI pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      - name: Run cargo-vet
        run: cargo vet
      - name: Verify exemption notes
        run: |
          python3 -c "
          import sys
          # Parse TOML without external dependency
          with open('supply-chain/config.toml') as f:
              content = f.read()
          # Simple check: every exemption block should have a notes field
          in_exemption = False
          has_notes = False
          current_name = ''
          missing = []
          for line in content.splitlines():
              stripped = line.strip()
              if stripped.startswith('[[') and 'exemptions' in stripped:
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = True
                  has_notes = False
                  current_name = stripped
              elif in_exemption and stripped.startswith('notes'):
                  has_notes = True
              elif stripped.startswith('[[') or stripped.startswith('['):
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = False
          if in_exemption and not has_notes:
              missing.append(current_name)
          if missing:
              print(f'❌ Missing notes for {len(missing)} exemptions')
              sys.exit(1)
          print('✅ All exemptions have notes')
          "

  reproducibility:
    name: Build Reproducibility
    runs-on: ubuntu-latest
    continue-on-error: true  # Rust builds are not yet fully deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build #1
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          RUSTFLAGS="-C link-arg=-Wl,--build-id=none" \
            cargo build --release --locked --target x86_64-unknown-linux-gnu
          sha256sum target/x86_64-unknown-linux-gnu/release/omnia-node > /tmp/build1.sha
      - name: Clean and rebuild
        run: |
          cargo clean
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          RUSTFLAGS="-C link-arg=-Wl,--build-id=none" \
            cargo build --release --locked --target x86_64-unknown-linux-gnu
          sha256sum target/x86_64-unknown-linux-gnu/release/omnia-node > /tmp/build2.sha
      - name: Compare builds
        run: |
          if diff /tmp/build1.sha /tmp/build2.sha; then
            echo "::notice::Reproducible build confirmed"
          else
            echo "::warning::Builds are not reproducible — known Rust/LLVM non-determinism"
          fi

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-tarpaulin --locked
      - run: cargo tarpaulin --workspace --exclude omnia-fuzz --out Xml --out Html
      - uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            tarpaulin-report.html
            cobertura.xml
          retention-days: 30

  fuzz-smoke:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    continue-on-error: true  # cargo-fuzz workspace integration may vary by version
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Override toolchain for fuzz
        run: rustup override set nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || cargo install cargo-fuzz
      - name: Build fuzz targets
        run: cargo fuzz build --fuzz-dir fuzz
      - name: Smoke test each target (10s each)
        run: |
          TARGETS=(
            fuzz_event_deserialization
            fuzz_gossip_message
            fuzz_zk_proof_deserialization
            fuzz_consensus_state_transition
            fuzz_vector_clock_merge
            fuzz_rate_limiter
            fuzz_snapshot_deserialization
          )
          for target in "${TARGETS[@]}"; do
            echo "--- Smoke testing $target ---"
            timeout 10 cargo fuzz run "$target" --fuzz-dir fuzz -- -runs=1000 2>&1 || {
              echo "Fuzz target $target crashed!"
              exit 1
            }
            echo "$target smoke test passed"
          done

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    continue-on-error: true  # SBOM generation is best-effort
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: |
          mkdir -p sbom
          cargo cyclonedx --all --format json
          cargo cyclonedx --all --format xml
          # Move generated SBOM files to sbom/ directory
          find . -name '*.bom.json' -exec mv {} sbom/ \; || true
          find . -name '*.bom.xml' -exec mv {} sbom/ \; || true
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnia-sbom
          path: sbom/
          retention-days: 90
      - name: Verify SBOM completeness
        run: |
          CRATES="substrate shards binding economics zk node"
          found=0
          for crate in $CRATES; do
            if ls sbom/${crate}*.json 2>/dev/null; then
              found=$((found + 1))
            else
              echo "Warning: Missing SBOM for $crate"
            fi
          done
          echo "Found SBOM for $found/$CRATES crates"
          if [ "$found" -eq 0 ]; then
            echo "No SBOM files found — check cargo-cyclonedx output format"
            ls -la sbom/ || true
          fi
