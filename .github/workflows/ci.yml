name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
          components: rustfmt, clippy
      - name: Free disk space
        run: |
          df -h /
          sudo apt-get clean -y
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/vcpkg /opt/hostedtoolcache 2>/dev/null || true
          df -h /
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-ci"
      - run: cargo fmt --all -- --check
      - name: Clippy (lib code — deny unwrap_used)
        run: cargo clippy --lib --workspace --exclude omnia-fuzz -- -D warnings -D clippy::unwrap_used
      - name: Clippy (all targets — deny unwrap_used in test code too)
        run: cargo clippy --all-targets --workspace --exclude omnia-fuzz -- -D clippy::unwrap_used
      - run: cargo doc --workspace --no-deps --exclude omnia-fuzz
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Verify exemption notes
        run: |
          python3 -c "
          import sys
          # Parse TOML without external dependency
          with open('supply-chain/config.toml') as f:
              content = f.read()
          # Simple check: every exemption block should have a notes field
          in_exemption = False
          has_notes = False
          current_name = ''
          missing = []
          for line in content.splitlines():
              stripped = line.strip()
              if stripped.startswith('[[') and 'exemptions' in stripped:
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = True
                  has_notes = False
                  current_name = stripped
              elif in_exemption and stripped.startswith('notes'):
                  has_notes = True
              elif stripped.startswith('[[') or stripped.startswith('['):
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = False
          if in_exemption and not has_notes:
              missing.append(current_name)
          if missing:
              print(f'Missing notes for {len(missing)} exemptions')
              sys.exit(1)
          print('All exemptions have notes')
          "
      - name: Check Prettier formatting
        run: |
          npm install -g prettier
          npx prettier --check "**/*.md" "**/*.json" "!**/node_modules/**" "!target/**" "!**/Cargo.lock" "!supply-chain/**"
        continue-on-error: true  # Existing files not yet Prettier-formatted

  feature-matrix:
    name: Feature Matrix (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: "--features full"
            toolchain: "1.91.0"
          - features: "--features light"
            toolchain: "1.91.0"
          - features: "--no-default-features"
            toolchain: "1.91.0"
          - features: "--no-default-features --features full"
            toolchain: "1.91.0"
          # all-features includes ethereum-live (alloy) which needs rustc ≥1.91
          - features: "--all-features"
            toolchain: "1.91.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Free disk space
        run: |
          df -h /
          sudo apt-get clean -y
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/vcpkg /opt/hostedtoolcache 2>/dev/null || true
          df -h /
      - name: Override toolchain for non-1.91 builds
        if: matrix.toolchain != '1.91.0'
        run: rustup override set ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-feature-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.features }}"
      - name: Check with ${{ matrix.features || 'default' }}
        run: cargo check -p omnia-node ${{ matrix.features }}
      - name: Test with ${{ matrix.features || 'default' }}
        run: cargo test -p omnia-node ${{ matrix.features }} --lib -- --skip settlement::live

  test:
    name: Test (${{ matrix.rust }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v5
      - name: Remove conflicting Homebrew rustup (macOS)
        if: runner.os == 'macOS'
        run: |
          brew unlink rustup 2>/dev/null || true
          rm -f /usr/local/bin/cargo /opt/homebrew/bin/cargo
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - name: Verify cargo works
        run: |
          cargo --version
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-test-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}"
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          # Remove unused Docker images, old packages, and tmp files
          sudo apt-get clean -y
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/vcpkg 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h /
      - name: Verify Cargo.lock is up to date
        run: cargo test --locked --workspace --exclude omnia-fuzz --no-run
      - name: Clean debug artifacts before tests
        run: |
          # Remove debug profile artifacts to free space for test compilation.
          # Only release-profile artifacts are needed for the release-build job.
          cargo clean -p omnia-substrate --profile dev 2>/dev/null || true
          echo "=== Disk space after clean ==="
          df -h / || true
      # Skip settlement::live tests on all PRs — they require a live Ethereum
      # endpoint which is only available on main branch with secrets.
      # Mock settlement tests always pass (MSRV 1.91, zero alloy).
      - name: Test workspace (skip live settlement)
        run: cargo test --workspace --exclude omnia-fuzz --lib --bins --tests --verbose -- --skip settlement::live
        timeout-minutes: 15
      # all-features includes ethereum-live; needs rustc ≥1.91 for alloy.
      # The stable toolchain may be <1.91, so this step is allowed to fail.
      # The feature-matrix job tests --all-features with toolchain 1.91.0 explicitly.
      - name: Test workspace with all features (skip live settlement + docker)
        run: cargo test --workspace --exclude omnia-fuzz --all-features --lib --bins --tests --verbose -- --skip settlement::live --skip docker_compose
        timeout-minutes: 15
        continue-on-error: true  # May fail if stable rustc < 1.91 (ethereum-live needs alloy)

  chaos-critical:
    name: Critical Chaos Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - name: Free disk space
        run: |
          df -h /
          sudo apt-get clean -y
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/vcpkg /opt/hostedtoolcache 2>/dev/null || true
          df -h /
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-chaos"
      - name: Run crash recovery chaos test
        run: cargo test -p omnia-chaos-tests --test crash_recovery --verbose
        timeout-minutes: 10
      - name: Run byzantine chaos test
        run: cargo test -p omnia-chaos-tests --test byzantine --verbose
        timeout-minutes: 10

  binary-size:
    name: Release Binary Size Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-release-size"
      - name: Build release binary (production profile)
        run: cargo build -p omnia-node --release --no-default-features --features full
        timeout-minutes: 20
      - name: Verify binary size ≤ 16 MB
        run: |
          SIZE=$(stat --format="%s" target/release/omnia-node)
          MAX=$((16 * 1024 * 1024))  # 16,777,216 bytes
          echo "Binary size: $SIZE bytes ($(( SIZE / 1024 / 1024 )) MB)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::Binary size $SIZE exceeds 16 MB limit ($MAX bytes)"
            exit 1
          fi
          echo "::notice::Binary size check passed: $SIZE bytes ≤ $MAX bytes"

  msrv:
    name: MSRV Check (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.91.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-msrv"
      # NOTE: ethereum-live feature (alloy dep) requires rustc ≥1.91, so it is
      # excluded from the MSRV check.  The ethereum-settlement workflow tests
      # that feature with the stable toolchain instead.
      #
      # Strategy: check the workspace with default features (no ethereum-live),
      # then explicitly check omnia-adapters with all MSRV-safe features.
      - name: Check workspace compiles with MSRV (default features, excluding ethereum-live)
        run: cargo +1.91.0 check --workspace --exclude omnia-fuzz --exclude omnia-chaos-tests --exclude omnia-benches
      - name: Check omnia-adapters with no features (MSRV baseline)
        run: cargo +1.91.0 check -p omnia-adapters --no-default-features
      - name: Check omnia-adapters with arkworks feature (MSRV-safe)
        run: cargo +1.91.0 check -p omnia-adapters --features arkworks
      - name: Check omnia-node with full feature (MSRV-safe, excludes ethereum-live)
        run: cargo +1.91.0 check -p omnia-node --no-default-features --features full
      - name: Verify MSRV with cargo-msrv
        run: |
          cargo install cargo-msrv --version 0.19.1 --locked
          # cargo-msrv 0.19.x doesn't support --workspace/--exclude/-p flags.
          # Run it on the root package only (omnia-protocol workspace root).
          # The MSRV is verified by the cargo +1.91.0 check steps above.
          cargo msrv verify --min 1.91.0 -- cargo check --lib 2>&1 || true
        continue-on-error: true  # cargo-msrv may drift with new dep requirements

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny unmaintained --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2024-0437 --ignore RUSTSEC-2025-0055 --ignore RUSTSEC-2025-0057 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119 --ignore RUSTSEC-2026-0173
        # NOTE: RUSTSEC-2023-0079 (KyberSlash / pqc_kyber) was removed from
        # the ignore list after migrating to ml-kem (ADR-020).  The pqc_kyber
        # crate no longer appears in Cargo.lock, so the advisory should not
        # be triggered.  If it reappears, that indicates a regression.
        #
        # CI-failure mitigations (audit v0.1.68 follow-up):
        # - RUSTSEC-2026-0173: proc-macro-error2 unmaintained (transitive via
        #   alloy-sol-macro). Tracked for upstream fix.
        # - Switched from `--deny warnings` to `--deny unmaintained` (only)
        #   so that *yanked* crates (bitcoin-io 0.1.100, bitcoin_hashes
        #   0.14.100 — pulled in transitively via bip39 and secp256k1)
        #   don't fail the build. `cargo audit` always denies vulnerabilities
        #   (non-zero exit) by default; `--deny unmaintained` adds unmaintained
        #   crates to the deny list. Yanked crates produce warnings only.
        #   Valid --deny values: warnings, unmaintained, unsound, yanked,
        #   notices. There is no `--deny vulnerability` (vulnerabilities are
        #   always denied by default).

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny check

  udeps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # cargo-udeps requires -Z binary-dep-depinfo which is nightly-only.
      # Use a pinned nightly to avoid regressions with the latest nightly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2025-12-01
          components: rust-src
      - name: Override toolchain for cargo-udeps
        run: rustup override set nightly-2025-12-01
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-udeps"
      - name: Install cargo-udeps
        run: cargo +nightly-2025-12-01 install cargo-udeps --locked
      - name: Check for unused dependencies
        run: cargo +nightly-2025-12-01 udeps --workspace --all-features --exclude omnia-fuzz
        continue-on-error: true  # cargo-udeps may report false positives
      # NOTE: omnia-adapters with --all-features includes ethereum-live
      # which requires rustc ≥1.91. The udeps check runs on nightly which
      # satisfies this requirement.

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-mutants"
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutation testing on core crates (primitives + consensus only)
        run: cargo mutants --in-place -p omnia-primitives -p omnia-consensus --check --timeout 300
        timeout-minutes: 30
        continue-on-error: true  # Report score but don't block CI

  benchmark-comparison:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-bench-${{ hashFiles('**/Cargo.lock') }}"

      # ── CPU frequency governor ──────────────────────────────────────
      # Pin the CPU to performance governor to reduce inter-run variance.
      # GitHub Actions ubuntu-latest runners default to "powersave" or
      # "schedutil" governor, which causes ~23% swing between benchmark
      # suites as the CPU frequency boosts and throttles. Setting
      # "performance" governor locks the CPU at its base frequency,
      # producing stable, comparable measurements.
      #
      # This requires sudo and may fail on some runner configurations
      # (e.g., if cpupower is not installed or the runner doesn't allow
      # governor changes). The step is continue-on-error so the job
      # proceeds even if governor setup fails.
      - name: Set CPU performance governor
        run: |
          if command -v cpupower &>/dev/null; then
            sudo cpupower frequency-set -g performance || echo "WARN: cpupower governor set failed (non-fatal)"
          elif [ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]; then
            for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              echo performance | sudo tee "$cpu" 2>/dev/null || true
            done
            echo "CPU governor set to performance"
          else
            echo "WARN: CPU governor not adjustable on this runner (non-fatal)"
          fi

          # Verify the governor actually changed
          echo "---CPU governor verification---"
          if [ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]; then
            for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              actual=$(cat "$cpu" 2>/dev/null || echo "unreadable")
              echo "  $(basename $(dirname $cpu)): $actual"
            done
          else
            echo "  scaling_governor file not found — governor not adjustable on this runner"
          fi
        continue-on-error: true

      - name: Build benchmarks
        run: cargo bench --no-run -p omnia-benches --features full

      # ── Run fast benchmarks only (fits in CI budget) ────────────────
      # The benchmark-comparison job has a 20-minute timeout. The ZK
      # benchmarks (baseline_bench --features full, which includes
      # zk_proof_gen) can take 85+ seconds PER SAMPLE and 10 samples per
      # bench, exceeding the budget. ZK benchmarks are moved to the
      # scheduled benchmarks.yml workflow instead.
      #
      # This job runs:
      #   - throughput.rs (fast: ~30s total)
      #   - sharding_bench.rs (fast: ~2min total)
      #   - baseline_bench.rs WITHOUT --features full (skips ZK group)
      #
      # The regression gate (check_benchmark_regression.py) is tolerant
      # of missing benchmarks — it reports them as MISSING but does NOT
      # fail CI. ZK regression gating is handled by the scheduled
      # benchmarks.yml workflow.
      - name: Run fast benchmarks (throughput + sharding, no ZK)
        run: |
          # Always use --save-baseline main. Criterion's --baseline flag
          # panics if no baseline exists for a specific bench binary.
          # The marker-file approach (checking .omnia-baseline-saved) was
          # flawed: the marker was created after the first bench binary
          # (throughput+sharding) saved its baseline, but the second bench
          # binary (baseline_bench) had never saved a baseline, causing
          # --baseline main to panic.
          #
          # The regression gate (check_benchmark_regression.py) does NOT
          # use Criterion's baseline mechanism — it parses criterion's
          # stdout (the time: [...] lines) and compares against
          # baselines.json. So we don't need --baseline for comparison;
          # --save-baseline just saves Criterion's internal data for its
          # own HTML reports.
          cargo bench -p omnia-benches --bench throughput --bench sharding_bench -- --save-baseline main 2>&1 | tee criterion_output.txt
        timeout-minutes: 10
        continue-on-error: true  # Benchmarks are informational

      - name: Run baseline benchmarks (consensus + DAG + gossip, no ZK)
        run: |
          # baseline_bench.rs includes a zk_proof_gen group that is
          # feature-gated under "full". By running WITHOUT --features full,
          # the ZK group emits a no-op "skipped_no_full_feature" bench and
          # the fast consensus/DAG/gossip benches run normally.
          #
          # Always use --save-baseline main (see comment above for why
          # --baseline main panics on first run).
          cargo bench -p omnia-benches --bench baseline_bench -- --save-baseline main 2>&1 | tee -a criterion_output.txt
        timeout-minutes: 8
        continue-on-error: true  # Benchmarks are informational

      # ── Regression gate ────────────────────────────────────────────
      # The gate output is captured to regression_gate.txt and uploaded
      # as a separate artifact so it can be reviewed without parsing
      # the full criterion output.
      - name: Check benchmark regressions
        run: |
          python3 scripts/check_benchmark_regression.py \
            --baselines benches/baselines.json \
            criterion_output.txt 2>&1 | tee regression_gate.txt || true  # Informational only

      - name: Upload criterion results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: criterion-comparison-results
          path: |
            criterion_output.txt
            regression_gate.txt
          retention-days: 30

  supply-chain:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked
      - name: Run cargo-vet
        run: cargo vet
        continue-on-error: true  # Track progress without blocking CI
      - name: Verify exemption notes
        run: |
          python3 -c "
          import sys
          with open('supply-chain/config.toml') as f:
              content = f.read()
          in_exemption = False
          has_notes = False
          current_name = ''
          missing = []
          for line in content.splitlines():
              stripped = line.strip()
              if stripped.startswith('[[') and 'exemptions' in stripped:
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = True
                  has_notes = False
                  current_name = stripped
              elif in_exemption and stripped.startswith('notes'):
                  has_notes = True
              elif stripped.startswith('[[') or stripped.startswith('['):
                  if in_exemption and not has_notes:
                      missing.append(current_name)
                  in_exemption = False
          if in_exemption and not has_notes:
              missing.append(current_name)
          if missing:
              print(f'Missing notes for {len(missing)} exemptions')
              sys.exit(1)
          print('All exemptions have notes')
          "

  reproducibility:
    name: Build Reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build #1
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          RUSTFLAGS="-C link-arg=-Wl,--build-id=none" \
            cargo build --release --locked --target x86_64-unknown-linux-gnu -p omnia-node --no-default-features --features full
          sha256sum target/x86_64-unknown-linux-gnu/release/omnia-node > /tmp/build1.sha
      - name: Clean and rebuild
        run: |
          cargo clean
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          RUSTFLAGS="-C link-arg=-Wl,--build-id=none" \
            cargo build --release --locked --target x86_64-unknown-linux-gnu -p omnia-node --no-default-features --features full
          sha256sum target/x86_64-unknown-linux-gnu/release/omnia-node > /tmp/build2.sha
      - name: Compare builds
        run: |
          if diff /tmp/build1.sha /tmp/build2.sha; then
            echo "::notice::Reproducible build confirmed"
          else
            echo "::warning::Builds are not reproducible — known Rust/LLVM non-determinism"
          fi

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Use stable toolchain for coverage — some workspace crates have optional
      # features (ethereum-live) requiring rustc >=1.91, and coverage may enable
      # additional features during instrumentation.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-coverage"
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --exclude omnia-fuzz --lcov --output-path lcov.info --ignore-run-fail
      - name: Generate coverage summary
        run: cargo llvm-cov --workspace --exclude omnia-fuzz --summary-only --ignore-run-fail 2>&1 | tee coverage-summary.txt
      - uses: codecov/codecov-action@v4
        with:
          files: ./lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt
          retention-days: 30

  fuzz-smoke:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pin to a known-good nightly. Latest nightly often has regressions with
      # ASAN + SanitizerCoverage (e.g. __sancov_gen_ linker errors).  The
      # nightly-2025-12-01 toolchain is known to work with cargo-fuzz + ASAN.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2025-12-01
          components: rust-src, llvm-tools-preview
      - name: Override toolchain for fuzz
        run: rustup override set nightly-2025-12-01
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets (no ASAN for smoke test)
        # Build with --sanitizer none to avoid ASAN+sancov linker errors on
        # some nightly toolchains.  Coverage instrumentation still works for
        # smoke testing; full ASAN fuzzing runs in the nightly-fuzz workflow.
        run: cargo fuzz build --fuzz-dir fuzz --sanitizer none
      - name: Smoke test each target (30s each)
        # Smoke tests exercise fuzz targets with a small number of inputs.
        # A crash here may indicate a real bug, but it can also be a false
        # positive from the nightly toolchain.  Failures are reported as
        # warnings so the nightly-fuzz workflow can investigate further.
        continue-on-error: true
        run: |
          TARGETS=(
            fuzz_event_deserialization
            fuzz_gossip_message
            fuzz_zk_proof_deserialization
            fuzz_consensus_state_transition
            fuzz_vector_clock_merge
            fuzz_rate_limiter
            fuzz_snapshot_deserialization
            fuzz_primitives_event
            fuzz_causal_graph_insert
            fuzz_shard_route
            fuzz_event_validate
            fuzz_vector_clock_raw
          )
          FAILED=0
          for target in "${TARGETS[@]}"; do
            echo "--- Smoke testing $target ---"
            # Use 300s timeout to allow for compilation + fuzzing.
            # fuzz_gossip_message depends on omnia-network (libp2p) which
            # takes ~2min to compile on first run, then recompiles again
            # for cargo fuzz run. Total can exceed 180s.
            if timeout 300 cargo fuzz run "$target" --fuzz-dir fuzz --sanitizer none -- -runs=1000 2>&1; then
              echo "$target smoke test passed"
            else
              echo "::warning::$target smoke test failed (may indicate a real bug)"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::warning::$FAILED fuzz smoke test(s) failed — investigate in nightly-fuzz workflow"
          fi

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: |
          mkdir -p sbom
          cargo cyclonedx --all --format json
          cargo cyclonedx --all --format xml
          find . -name '*.bom.json' -exec mv {} sbom/ \; || true
          find . -name '*.bom.xml' -exec mv {} sbom/ \; || true
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v5
        with:
          name: omnia-sbom
          path: sbom/
          retention-days: 90
      - name: Verify SBOM completeness
        run: |
          CRATES="omnia-primitives omnia-consensus omnia-crypto omnia-network omnia-adapters omnia-shards omnia-binding omnia-economics omnia-node"
          found=0
          total=0
          for crate in $CRATES; do
            total=$((total + 1))
            if ls sbom/${crate}*.json 2>/dev/null; then
              found=$((found + 1))
            else
              echo "Warning: Missing SBOM for $crate"
            fi
          done
          echo "Found SBOM for $found/$total crates"
          if [ "$found" -eq 0 ]; then
            echo "No SBOM files found — check cargo-cyclonedx output format"
            ls -la sbom/ || true
          fi
