name: Multi-Node BFT Test

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6AM UTC
  workflow_dispatch:

jobs:
  bft-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-bft-${{ hashFiles('**/Cargo.lock') }}"
      - name: Run multi-node BFT tests
        run: cargo test -p omnia-consensus --test multi_node_test -- --nocapture
      - name: Run network integration tests
        run: cargo test -p omnia-network --test network_integration_test --features network -- --ignored --nocapture
