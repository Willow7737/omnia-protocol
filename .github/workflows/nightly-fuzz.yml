name: Nightly Fuzz & Security

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # ── Parallelized fuzz jobs by crate domain ────────────────────────────────
  # Split targets into 3 matrix jobs for ~60-80% CI runtime reduction.
  # Each job runs 2-3 targets sequentially with a 300s budget per target.
  # Total wall-clock: ~15 min (vs ~25 min sequential on a single runner).

  fuzz:
    name: Fuzz (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: primitives
            targets: "fuzz_event_deserialization fuzz_primitives_event fuzz_vector_clock_merge fuzz_vector_clock_raw fuzz_event_validate"
          - group: consensus-network
            targets: "fuzz_consensus_state_transition fuzz_gossip_message fuzz_rate_limiter fuzz_causal_graph_insert"
          - group: adapters-binding
            targets: "fuzz_zk_proof_deserialization fuzz_snapshot_deserialization fuzz_shard_route"
    steps:
      - uses: actions/checkout@v5
      # Use a recent nightly for fuzz builds.  The --sanitizer none flag
      # avoids __sancov_gen_ linker errors that occur when ASan and
      # SanitizerCoverage are combined on certain nightly versions.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2025-12-01
          components: rust-src, llvm-tools-preview
      - name: Override toolchain for fuzz
        run: rustup override set nightly-2025-12-01
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-fuzz-${{ matrix.group }}"
      - name: Build fuzz targets
        run: cargo fuzz build --fuzz-dir fuzz --sanitizer none
        # Use --sanitizer none to avoid __sancov_gen_ linker errors caused by
        # ASan + SanitizerCoverage incompatibility on recent nightly toolchains.
        # SanitizerCoverage (needed for fuzzing) is still enabled via RUSTFLAGS
        # set by cargo-fuzz; only ASan is disabled here.
      - name: Run fuzz targets
        shell: bash
        run: |
          set +e  # Don't exit on non-zero — we handle exit codes manually
          FAILED=0
          for target in ${{ matrix.targets }}; do
            if cargo fuzz list --fuzz-dir fuzz 2>/dev/null | grep -qx "$target"; then
              echo "=== Fuzzing $target ==="
              # Run fuzz target with a time budget.  Exit code 124 from timeout
              # is normal (time exhausted).  Exit code 0 means the target
              # exited on its own (e.g. -runs limit reached).  Any other
              # non-zero exit code indicates a crash or error.
              timeout 300 cargo fuzz run "$target" --fuzz-dir fuzz --sanitizer none -- -max_total_time=300 -runs=100000
              ec=$?
              if [ "$ec" -eq 124 ]; then
                echo "$target: time budget exhausted (normal)"
              elif [ "$ec" -ne 0 ]; then
                echo "::error::$target exited with code $ec (possible crash)"
                FAILED=1
              else
                echo "$target: completed successfully"
              fi
            else
              echo "Fuzz target $target not found — skipping"
            fi
          done
          exit $FAILED
      - name: Shrink crash corpus
        if: always()
        shell: bash
        run: |
          # Minimize corpus for any target that produced inputs.
          # This keeps the artifact small and removes redundant seeds.
          for target in ${{ matrix.targets }}; do
            if [ -d "fuzz/corpus/$target" ] && [ "$(ls -A fuzz/corpus/$target 2>/dev/null)" ]; then
              echo "Minimizing corpus for $target"
              cargo fuzz cmin "$target" --fuzz-dir fuzz --sanitizer none 2>/dev/null || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-corpus-${{ matrix.group }}-${{ github.run_id }}
          path: fuzz/corpus/
          retention-days: 7

  # ── Security audit with aligned ignore list ───────────────────────────────
  # This job mirrors the deny.toml advisory ignore list so that the nightly
  # deep scan doesn't fail on documented exemptions.  The --deny warnings
  # flag ensures NEW, undocumented vulnerabilities fail the pipeline.

  security-scan:
    name: Deep Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - name: Run cargo audit (JSON report)
        run: |
          cargo audit --json \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0437 \
            --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            > audit-report.json
      - name: Run cargo audit (deny unmaintained for new vulns)
        run: |
          cargo audit --deny unmaintained \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2024-0388 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0437 \
            --ignore RUSTSEC-2025-0055 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2026-0173
      - uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_id }}
          path: audit-report.json
          retention-days: 30

  # ── Cargo deny check (mirrors ci.yml) ─────────────────────────────────────
  # Runs alongside the nightly scan for defense-in-depth.

  deny-scan:
    name: Cargo Deny Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny check
