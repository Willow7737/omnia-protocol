name: Nightly Fuzz & Security

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - name: Override toolchain for fuzz
        run: rustup override set nightly
      - name: Install cargo-fuzz
        run: |
          # Try installing the latest cargo-fuzz first (without --locked
          # so cargo resolves compatible transitive deps for the current
          # nightly toolchain).  Fall back to pinning a known-good nightly
          # if the default latest nightly breaks due to rustc attribute
          # reservation (e.g. rustix incompatibility).
          if ! cargo install cargo-fuzz 2>/dev/null; then
            echo "::warning::cargo-fuzz install failed on latest nightly; trying nightly-2026-03-15"
            rustup toolchain install nightly-2026-03-15 --component llvm-tools-preview
            rustup override set nightly-2026-03-15
            cargo install cargo-fuzz --locked
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-fuzz"
      - name: Build fuzz targets
        run: cargo fuzz build --fuzz-dir fuzz
      - name: Run fuzz targets
        shell: bash
        run: |
          set +e  # Don't exit on non-zero — we handle exit codes manually
          if ! command -v cargo-fuzz &>/dev/null; then
            echo "cargo-fuzz not installed — skipping fuzz run"
            exit 0
          fi
          FAILED=0
          for target in fuzz_event_deserialization fuzz_gossip_message fuzz_zk_proof_deserialization fuzz_consensus_state_transition fuzz_vector_clock_merge fuzz_rate_limiter fuzz_snapshot_deserialization fuzz_primitives_event; do
            if [ -f "fuzz/fuzz_targets/$target.rs" ]; then
              echo "=== Fuzzing $target ==="
              # Run fuzz target with a time budget.  Exit code 124 from timeout
              # is normal (time exhausted).  Exit code 0 means the target
              # exited on its own (e.g. -runs limit reached).  Any other
              # non-zero exit code indicates a crash or error.
              timeout 180 cargo fuzz run "$target" --fuzz-dir fuzz -- -max_total_time=180 -runs=50000
              ec=$?
              if [ $ec -eq 124 ]; then
                echo "$target: time budget exhausted (normal)"
              elif [ $ec -ne 0 ]; then
                echo "::error::$target exited with code $ec (possible crash)"
                FAILED=1
              else
                echo "$target: completed successfully"
              fi
            else
              echo "Fuzz target $target not found — skipping"
            fi
          done
          exit $FAILED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-corpus-${{ github.run_id }}
          path: fuzz/corpus/
          retention-days: 7

  security-scan:
    name: Deep Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --json > audit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_id }}
          path: audit-report.json
          retention-days: 30
