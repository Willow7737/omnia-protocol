name: Benchmark Regression Gate

# Runs criterion + iai-callgrind benchmarks and enforces regression gates
# against stored baselines. A regression of >25% compared to baseline FAILS.
#
# Triggers:
#   - Push to main or dev
#   - Manual workflow_dispatch
#
# Benchmarks covered:
#   - Consensus throughput (events/sec)
#   - DAG insertion latency
#   - Gossip propagation latency
#   - ZK proof generation latency
#   - VRF compute / vector clock merge
#   - Event creation + signing

on:
  push:
    branches: [main, dev]
    paths:
      - 'omnia-consensus/**'
      - 'omnia-crypto/**'
      - 'omnia-network/**'
      - 'omnia-adapters/**'
      - 'omnia-primitives/**'
      - 'benches/**'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Regression threshold % (default: 10)'
        required: false
        default: '10'
      run_zk:
        description: 'Run ZK benchmarks (slow, requires full feature)'
        required: false
        type: boolean
        default: true
      run_multi_sample:
        description: 'Run multi-sample significance gate (5 runs, 95% CI — slow)'
        required: false
        type: boolean
        default: false
      multi_sample_runs:
        description: 'Number of runs for multi-sample gate (default: 5)'
        required: false
        default: '5'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  criterion-bench:
    name: Criterion Benchmarks (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-bench-regression-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install gnuplot
        run: sudo apt-get update && sudo apt-get install -y gnuplot

      # ── CPU frequency governor ──────────────────────────────────────
      # Pin CPU to performance governor to reduce ~23% inter-run variance
      # caused by CPU frequency boosting/throttling on shared CI runners.
      - name: Set CPU performance governor
        run: |
          if command -v cpupower &>/dev/null; then
            sudo cpupower frequency-set -g performance || echo "WARN: cpupower governor set failed (non-fatal)"
          elif [ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]; then
            for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              echo performance | sudo tee "$cpu" 2>/dev/null || true
            done
            echo "CPU governor set to performance"
          else
            echo "WARN: CPU governor not adjustable on this runner (non-fatal)"
          fi

          # ── Verify the governor actually changed ────────────────────
          # The cpupower/tee commands above may silently fail on GitHub
          # Actions runners (Azure VMs restrict governor changes). This
          # verification step reads the actual governor and logs it so
          # we can confirm whether the setting took effect. If it didn't,
          # the ~23% inter-run variance will persist and benchmark
          # numbers should be treated as preliminary.
          echo "---CPU governor verification---"
          if [ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]; then
            for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              actual=$(cat "$cpu" 2>/dev/null || echo "unreadable")
              echo "  $(basename $(dirname $cpu)): $actual"
            done
          else
            echo "  scaling_governor file not found — governor not adjustable on this runner"
          fi
        continue-on-error: true

      # ── Run fast criterion benchmarks ──────────────────────────────
      # Only run the fast benchmarks (throughput, sharding, baseline_bench
      # without ZK). ZK benchmarks are in the zk-bench job below to avoid
      # exceeding the job timeout.
      - name: Run throughput benchmarks
        run: |
          cargo bench -p omnia-benches --bench throughput 2>&1 | tee -a criterion_output.txt

      - name: Run baseline benchmarks (consensus + DAG + gossip, no ZK)
        run: |
          # Run baseline_bench WITHOUT --features full to skip the ZK group.
          # The ZK group is feature-gated and emits a no-op bench without full.
          cargo bench -p omnia-benches --bench baseline_bench 2>&1 | tee -a criterion_output.txt
        continue-on-error: true

      - name: Run sharding benchmarks
        run: |
          cargo bench -p omnia-benches --bench sharding_bench 2>&1 | tee -a criterion_output.txt

      # ── Regression gate ────────────────────────────────────────────
      # The gate output is captured to regression_gate.txt and uploaded
      # as a separate artifact so it can be reviewed without parsing
      # the full criterion output.
      - name: Check benchmark regressions
        run: |
          python3 scripts/check_benchmark_regression.py \
            --baselines benches/baselines.json \
            ${{ github.event.inputs.threshold != '' && format('--threshold {0}', github.event.inputs.threshold) || '' }} \
            criterion_output.txt 2>&1 | tee regression_gate.txt

      # ── Upload artifacts ───────────────────────────────────────────
      - name: Upload criterion results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: criterion-regression-results
          path: |
            criterion_output.txt
            regression_gate.txt
          retention-days: 30

      - name: Upload criterion data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: criterion-data
          path: target/criterion/
          retention-days: 7

  # ── ZK benchmarks in a separate job ──────────────────────────────
  # ZK benchmarks (zk_proof_gen, groth16_proof_generation) can take 85+
  # seconds per sample. Running them in a separate job with a longer
  # timeout prevents the fast benchmarks from being killed when the ZK
  # suite exceeds the combined job budget.
  zk-bench:
    name: Criterion Benchmarks (ZK, slow)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event.inputs.run_zk != 'false' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-bench-zk-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install gnuplot
        run: sudo apt-get update && sudo apt-get install -y gnuplot

      - name: Set CPU performance governor
        run: |
          if command -v cpupower &>/dev/null; then
            sudo cpupower frequency-set -g performance || echo "WARN: cpupower governor set failed (non-fatal)"
          elif [ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]; then
            for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              echo performance | sudo tee "$cpu" 2>/dev/null || true
            done
          else
            echo "WARN: CPU governor not adjustable on this runner (non-fatal)"
          fi

          # Verify the governor actually changed
          echo "---CPU governor verification---"
          if [ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]; then
            for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              actual=$(cat "$cpu" 2>/dev/null || echo "unreadable")
              echo "  $(basename $(dirname $cpu)): $actual"
            done
          else
            echo "  scaling_governor file not found — governor not adjustable on this runner"
          fi
        continue-on-error: true

      # ── Run ZK benchmarks (feature-gated, slow) ─────────────────────
      - name: Run baseline_bench ZK group (--features full)
        run: |
          # baseline_bench with --features full includes the zk_proof_gen group.
          cargo bench -p omnia-benches --bench baseline_bench --features full -- zk_proof_gen 2>&1 | tee -a zk_criterion_output.txt
        continue-on-error: true  # ZK benchmarks may fail if arkworks deps unavailable

      - name: Run standalone ZK benchmarks
        run: |
          cargo bench -p omnia-benches --bench zk_benchmarks --features full 2>&1 | tee -a zk_criterion_output.txt
        continue-on-error: true

      # ── Regression gate for ZK benchmarks only ──────────────────────
      # SECURITY FIX (mentor review 2026-06-23): removed `|| true` so the
      # ZK gate can actually fail CI. The previous behavior made the gate
      # decorative — any regression, no matter how severe, was masked by
      # the `|| true` shell short-circuit. The per-benchmark thresholds in
      # baselines.json (20% for ZK) accommodate the ~10-15% allocator-state
      # variance inherent to Groth16 proof generation while still catching
      # real regressions. If the ZK benchmarks produce partial output (e.g.,
      # feature-flag mismatch), the regression script's >50%-missing check
      # will fail CI with a clear error message.
      - name: Check ZK benchmark regressions
        run: |
          python3 scripts/check_benchmark_regression.py \
            --baselines benches/baselines.json \
            --zk-only \
            ${{ github.event.inputs.threshold != '' && format('--threshold {0}', github.event.inputs.threshold) || '' }} \
            zk_criterion_output.txt 2>&1 | tee zk_regression_gate.txt

      - name: Upload ZK criterion results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zk-criterion-results
          path: |
            zk_criterion_output.txt
            zk_regression_gate.txt
          retention-days: 30

  # ── Network-simulated multi-node benchmarks ──────────────────────
  # Addresses mentor critique: "22 µs finality on a local benchmark
  # with no network, no quorum, no adversarial delay is not a consensus
  # system performance claim. It's a function call latency number."
  #
  # These benchmarks use the ChaosNetwork in-process simulation to
  # measure the FULL consensus pipeline: event creation → gossip →
  # peer receipt → graph insert → consensus → finality. The numbers
  # are still synthetic (no real TCP/UDP) but they include the multi-
  # node coordination overhead that single-node benchmarks omit.
  network-sim-bench:
    name: Network-Simulated Multi-Node
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-bench-network-sim-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install gnuplot
        run: sudo apt-get update && sudo apt-get install -y gnuplot

      - name: Set CPU performance governor
        run: |
          if command -v cpupower &>/dev/null; then
            sudo cpupower frequency-set -g performance || true
          elif [ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]; then
            for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              echo performance | sudo tee "$cpu" 2>/dev/null || true
            done
          fi
        continue-on-error: true

      # Run the network-sim benchmarks. These are SLOW (each iteration
      # creates a fresh N-node network and runs multiple consensus
      # rounds) so we use a reduced sample size.
      - name: Run network-sim benchmarks
        run: |
          cargo bench -p omnia-benches --bench network_sim 2>&1 | tee network_sim_output.txt

      # Regression gate for network-sim benchmarks. Uses --filter-prefix
      # to only check the network_sim_* baselines.
      - name: Check network-sim regressions
        run: |
          python3 scripts/check_benchmark_regression.py \
            --baselines benches/baselines.json \
            --filter-prefix network_sim_ \
            network_sim_output.txt 2>&1 | tee network_sim_gate.txt
        continue-on-error: true  # Network-sim has high variance; informational for now

      - name: Upload network-sim results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: network-sim-results
          path: |
            network_sim_output.txt
            network_sim_gate.txt
          retention-days: 30

  iai-callgrind-bench:
    name: Iai-Callgrind Hot-Path
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-bench-iai-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      # iai-callgrind requires the iai-callgrind-runner binary to be installed
      # separately from the library crate. The runner version MUST match the
      # library version in benches/Cargo.toml (currently 0.13.4). Pinning the
      # version here prevents CI breakage when a newer runner is published to
      # crates.io (e.g., the 0.16.1 runner is incompatible with the 0.13
      # library and produces: "iai-callgrind-runner (0.16.1) is newer than
      # iai-callgrind (0.13.4)"). When bumping the library version in
      # benches/Cargo.toml, update this pin to match.
      - name: Install iai-callgrind runner
        run: cargo install iai-callgrind-runner --version 0.13.4 --locked

      # iai-callgrind requires the benchmark binary to be built first
      - name: Build iai-callgrind benchmarks
        run: cargo bench -p omnia-benches --bench hot_path_iai --no-run

      # ── Restore IAI baselines from cache ────────────────────────────
      # IAI baselines are stored as .old files in target/iai/. Without a
      # prior baseline, IAI reports N/A for all comparisons (no regression
      # signal). This step restores the baseline from the previous run's
      # cache so IAI can compare against it.
      #
      # FIX (mentor review 2026-06-23): the previous save key included
      # `${{ github.sha }}`, which created a new cache entry per commit.
      # GitHub Actions cache save SKIPS when an exact-match key already
      # exists — but since the key was SHA-specific, every commit was a
      # cache miss on save, and the restore-keys prefix fallback only
      # found the MOST RECENT SHA-keyed cache (which may have been from
      # a different branch with stale baselines).
      #
      # The correct pattern (per actions/cache docs) is:
      #   - Restore with a broad prefix (restore-keys) to find the most
      #     recent baseline from any prior run on this OS+job.
      #   - Save with a key that includes run_id (monotonically
      #     increasing per workflow run) so each run gets its own cache
      #     entry. This avoids the "cache already exists, skip save"
      #     problem while still allowing the next run to find this run's
      #     baselines via the prefix fallback.
      #
      # The run_id-scoped key means the cache grows by one entry per run,
      # but GitHub auto-evicts old entries (LRU, 7-day TTL, 10GB limit).
      # The important property is that the NEXT run always finds the
      # PREVIOUS run's baselines.
      - name: Restore IAI baselines
        uses: actions/cache@v4
        with:
          path: target/iai/
          key: iai-baselines-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            iai-baselines-${{ runner.os }}-${{ github.job }}-

      - name: Run iai-callgrind benchmarks
        run: |
          # Build first (separately) so compilation output doesn't
          # pollute the IAI benchmark output.
          cargo bench -p omnia-benches --bench hot_path_iai --no-run 2>&1 | tail -5

          # Run the benchmarks. Capture BOTH stdout and stderr into
          # iai_output.txt — iai-callgrind 0.13 writes benchmark results
          # to stderr (not stdout), so `2>iai_stderr.txt | tee` would
          # capture an empty file. The parser is robust enough to handle
          # mixed output (it only matches lines with the IAI metric
          # pattern and bench name pattern, ignoring cargo noise).
          cargo bench -p omnia-benches --bench hot_path_iai 2>&1 | tee iai_output.txt
        continue-on-error: true  # iai-callgrind may fail in CI due to valgrind overhead

      # ── IAI regression gate ─────────────────────────────────────────
      # Unlike criterion (wall-clock time, subject to CPU frequency
      # variance), iai-callgrind counts EXECUTED INSTRUCTIONS, which are
      # DETERMINISTIC for a given code path + compiler version. A
      # regression here is a real, non-noise signal. The threshold is 2%
      # (vs 10% for criterion) because there is no noise to tolerate.
      #
      # The baselines live in benches/iai_baselines.json (committed to
      # the repo, NOT cached) so the first run after a baseline update
      # always has a comparison point. This fixes the "N/A on every run"
      # problem that plagued the cache-based approach.
      - name: IAI regression gate
        if: always()
        run: |
          echo "=== iai_output.txt size ==="
          wc -c iai_output.txt 2>/dev/null || echo "FILE NOT FOUND"
          echo "=== iai_output.txt first 20 lines ==="
          head -20 iai_output.txt 2>/dev/null || echo "CANNOT READ FILE"
          echo "=== iai_output.txt last 20 lines ==="
          tail -20 iai_output.txt 2>/dev/null || echo "CANNOT READ FILE"
          echo "=== iai_stderr.txt size ==="
          wc -c iai_stderr.txt 2>/dev/null || echo "NO STDERR FILE"
          echo "=== Running IAI gate ==="
          if [ ! -s iai_output.txt ]; then
            echo "::warning::IAI output is empty — iai-callgrind may have failed. Skipping IAI gate."
            exit 0
          fi
          python3 scripts/check_iai_regression.py iai_output.txt 2>&1 | tee iai_regression_gate.txt

      # ── Save IAI baselines for future runs ──────────────────────────
      # After a successful run, the .old files in target/iai/ become the
      # baseline for the next run. We save with the run_id-scoped key so
      # the cache action always writes a new entry (no skip-on-exact-match).
      # The `always()` condition ensures baselines are saved even if the
      # bench step failed (continue-on-error), because partial baselines
      # are still better than no baselines for the next run.
      - name: Save IAI baselines
        if: always()
        uses: actions/cache/save@v4
        with:
          path: target/iai/
          key: iai-baselines-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}

      - name: Upload iai results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: iai-callgrind-results
          path: |
            iai_output.txt
            iai_stderr.txt
            iai_regression_gate.txt
            target/iai/
          retention-days: 30

  # ── Multi-sample statistical significance gate ───────────────────
  # Addresses mentor critique: single-sample point comparisons cannot
  # distinguish "the code is faster" from "the runner was faster today."
  # This job runs the criterion suite N times (default 5), computes a
  # 95% bootstrap CI per benchmark, and only fails if the CI does NOT
  # overlap the baseline AND the mean exceeds the threshold.
  #
  # This job is SLOW (5x the single-run cost) and runs only:
  #   - On pushes to main (pre-merge validation)
  #   - On manual workflow_dispatch with run_multi_sample=true
  # Regular dev-branch pushes use the single-sample gate above.
  multi-sample-bench:
    name: Multi-Sample Significance Gate (N=5, 95% CI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_multi_sample == 'true') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.91.0"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "omnia-bench-multi-${{ hashFiles('**/Cargo.lock') }}"

      - name: Install gnuplot
        run: sudo apt-get update && sudo apt-get install -y gnuplot

      - name: Set CPU performance governor
        run: |
          if command -v cpupower &>/dev/null; then
            sudo cpupower frequency-set -g performance || true
          elif [ -f /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]; then
            for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              echo performance | sudo tee "$cpu" 2>/dev/null || true
            done
          fi
        continue-on-error: true

      # Run the multi-sample gate. The script wraps `cargo bench`,
      # runs it --runs times, and applies the bootstrap CI test.
      # Default N=5; override via workflow_dispatch input.
      #
      # We run BOTH bench files (throughput + baseline_bench) so the
      # multi-sample gate checks all applicable baselines. Each run
      # only checks baselines whose source_bench was actually measured
      # (the script skips baselines not produced by the current bench
      # file, rather than reporting them as MISSING).
      - name: Run multi-sample significance gate (throughput)
        run: |
          python3 scripts/multi_sample_bench.py \
            --runs ${{ github.event.inputs.multi_sample_runs || '5' }} \
            --bench throughput \
            --baselines benches/baselines.json \
            --output multi_sample_throughput_results.txt 2>&1 | tee multi_sample_gate.txt
        continue-on-error: true  # Don't fail the job yet — baseline_bench runs next

      - name: Run multi-sample significance gate (baseline_bench)
        run: |
          python3 scripts/multi_sample_bench.py \
            --runs ${{ github.event.inputs.multi_sample_runs || '5' }} \
            --bench baseline_bench \
            --baselines benches/baselines.json \
            --output multi_sample_baseline_results.txt 2>&1 | tee -a multi_sample_gate.txt

      - name: Upload multi-sample results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: multi-sample-results
          path: |
            multi_sample_gate.txt
            multi_sample_results.txt
            multi_sample_baseline_results.txt
          retention-days: 30

  update-baseline:
    name: Update Baseline on Main
    needs: [criterion-bench, zk-bench]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download criterion data
        uses: actions/download-artifact@v5
        with:
          name: criterion-data
          path: target/criterion/

      - name: Save baseline for future comparisons
        run: |
          # The criterion data from this successful run becomes the new baseline
          # for the next regression gate. We store it as a GitHub Actions cache
          # entry keyed on the commit SHA.
          echo "Baseline saved from commit ${{ github.sha }}"
          echo "Criterion data available at target/criterion/"
          ls -la target/criterion/ || echo "No criterion data available"
        continue-on-error: true
