apiVersion: apps/v1
# P0-10 fix: StatefulSet (not Deployment) so each replica gets a stable
# network identity and persistent identity across restarts — required for
# BFT consensus, which assumes a peer's identity is stable. A Deployment
# would rotate pod identities on every reschedule.
kind: StatefulSet
metadata:
  name: {{ include "omnia-node.fullname" . }}
  labels:
    app: {{ include "omnia-node.name" . }}
    chart: {{ include "omnia-node.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  # P0-10 fix: serviceName is required for StatefulSet and gives each pod a
  # stable DNS name (e.g. omnia-node-0.omnia-node.default.svc.cluster.local).
  serviceName: {{ include "omnia-node.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "omnia-node.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "omnia-node.name" . }}
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "omnia-node.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # SECURITY FIX (audit): expose BOTH the HTTP API port (TCP 8080)
            # AND the P2P port (UDP 4001 for QUIC). The previous chart only
            # exposed TCP 9090, which meant Helm-deployed nodes could not
            # participate in P2P gossip at all (the libp2p swarm is
            # QUIC-only by default).
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: p2p
              containerPort: 4001
              protocol: UDP
          env:
            - name: RUST_LOG
              value: "info"
            # P0-10 fix: derive OMNIA_NODE_ID from the StatefulSet pod name
            # (e.g. "omnia-node-0"). The previous default of node.id: ""
            # caused every replica to share the same node identity, which
            # broke BFT (duplicate validator IDs) and gossip (every pod
            # advertised the same peer ID). Using metadata.name guarantees a
            # unique, stable identity per ordinal.
            - name: OMNIA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OMNIA_BOOTSTRAP_NODES
              value: {{ .Values.node.bootstrapNodes | quote }}
            - name: OMNIA_LISTEN_ADDR
              value: {{ .Values.node.listenAddr | quote }}
            - name: OMNIA_TOTAL_NODES
              value: {{ .Values.node.totalNodes | quote }}
            - name: OMNIA_DATA_DIR
              value: {{ .Values.node.dataDir | quote }}
            # P0-10 fix: JWT secret is required by the HTTP API for
            # authenticated endpoints (admin/mint/spend). Must be
            # provisioned out-of-band (e.g. via Sealed Secrets /
            # external-secrets) before the chart is installed. Without this,
            # the node either refuses to start or silently runs in a
            # degraded/insecure mode.
            - name: OMNIA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "omnia-node.fullname" . }}-jwt
                  key: jwt-secret
          # P0-10 fix: mount the ConfigMap (created by configmap.yaml when
          # configMap.data is non-empty) as environment variables. The
          # ConfigMap was previously rendered but never referenced, so user
          # overrides silently no-op'd. `optional: true` keeps the chart
          # installable when configMap.data is the default `{}`.
          envFrom:
            - configMapRef:
                name: {{ include "omnia-node.fullname" . }}-config
                optional: true
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omnia-node.fullname" . }}
        {{- else }}
          emptyDir: {}
        {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
