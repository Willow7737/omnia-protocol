apiVersion: apps/v1
# P0-10 fix: StatefulSet (not Deployment) so each replica gets a stable
# network identity and persistent identity across restarts — required for
# BFT consensus, which assumes a peer's identity is stable. A Deployment
# would rotate pod identities on every reschedule.
kind: StatefulSet
metadata:
  name: {{ include "omnia-node.fullname" . }}
  labels:
    app: {{ include "omnia-node.name" . }}
    chart: {{ include "omnia-node.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  # P0-10 fix: serviceName is required for StatefulSet and gives each pod a
  # stable DNS name (e.g. omnia-node-0.omnia-node.default.svc.cluster.local).
  serviceName: {{ include "omnia-node.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "omnia-node.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "omnia-node.name" . }}
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "omnia-node.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # SECURITY FIX (audit): expose BOTH the HTTP API port (TCP 8080)
            # AND the P2P port (UDP 4001 for QUIC). The previous chart only
            # exposed TCP 9090, which meant Helm-deployed nodes could not
            # participate in P2P gossip at all (the libp2p swarm is
            # QUIC-only by default).
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: p2p
              containerPort: 4001
              protocol: UDP
          # P0-10 fix: command override extracts the ordinal from the pod
          # name (e.g. "omnia-node-0" → 0) and adds 1, since node_id 0 is
          # invalid per config.rs validation. The previous chart set
          # OMNIA_NODE_ID=metadata.name directly, but node_id is parsed as
          # u64 in node/src/config.rs — values like "omnia-node-0" crashed
          # the pod on startup with "invalid digit found in string".
          command:
            - /bin/sh
            - -c
            - |
              ORDINAL="${POD_NAME##*-}"
              NODE_ID=$((ORDINAL + 1))
              export OMNIA_NODE_ID="${NODE_ID}"
              echo "Derived OMNIA_NODE_ID=${OMNIA_NODE_ID} from POD_NAME=${POD_NAME}"
              exec /app/omnia-node run
          env:
            - name: RUST_LOG
              value: "info"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OMNIA_BOOTSTRAP_NODES
              value: {{ .Values.node.bootstrapNodes | quote }}
            - name: OMNIA_LISTEN_ADDR
              value: {{ .Values.node.listenAddr | quote }}
            - name: OMNIA_TOTAL_NODES
              value: {{ .Values.node.totalNodes | quote }}
            - name: OMNIA_DATA_DIR
              value: {{ .Values.node.dataDir | quote }}
            # P0-10 fix: JWT secret is required by the HTTP API for
            # authenticated endpoints (admin/mint/spend). Must be
            # provisioned out-of-band (e.g. via Sealed Secrets /
            # external-secrets) before the chart is installed. Without this,
            # the node either refuses to start or silently runs in a
            # degraded/insecure mode.
            - name: OMNIA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "omnia-node.fullname" . }}-jwt
                  key: jwt-secret
          # P0-10 fix: mount the ConfigMap (created by configmap.yaml when
          # configMap.data is non-empty) as environment variables. The
          # ConfigMap was previously rendered but never referenced, so user
          # overrides silently no-op'd. `optional: true` keeps the chart
          # installable when configMap.data is the default `{}`.
          envFrom:
            - configMapRef:
                name: {{ include "omnia-node.fullname" . }}-config
                optional: true
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      # F-14 fix: volumeClaimTemplates replaces the standalone PVC.
      # The previous pvc.yaml created a single PVC referenced by name,
      # which meant only pod 0 could mount it (ReadWriteOnce). With
      # volumeClaimTemplates, each pod in the StatefulSet gets its own
      # PVC (e.g. data-omnia-node-0, data-omnia-node-1), so multi-
      # replica BFT deployments actually work.
      {{- if .Values.persistence.enabled }}
      volumeClaimTemplates:
        - metadata:
            name: data
            labels:
              app: {{ include "omnia-node.name" . }}
              release: {{ .Release.Name }}
          spec:
            accessModes:
              - {{ .Values.persistence.accessMode }}
            {{- if .Values.persistence.storageClass }}
            storageClassName: {{ .Values.persistence.storageClass }}
            {{- end }}
            resources:
              requests:
                storage: {{ .Values.persistence.size }}
      {{- else }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
