[package]
name = "omnia-adapters"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "ZK-rollup proof system and settlement adapters for L1 bridges"
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }

# Declare cfg values emitted by build.rs so the compiler knows they are valid
# and doesn't emit "unexpected cfg" warnings.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(has_settlement_lib)", "cfg(rustc_version_compatible)"] }

[dependencies]
omnia-primitives = { path = "../omnia-primitives" }
omnia-crypto = { path = "../omnia-crypto" }
omnia-consensus = { path = "../omnia-consensus" }
# ZK deps (feature-gated: arkworks)
ark-relations = { version = "0.4", optional = true }
ark-r1cs-std = { version = "0.4", optional = true }
ark-groth16 = { version = "0.4", optional = true }
ark-snark = { version = "0.4", optional = true }
ark-bn254 = { version = "0.4", optional = true }
ark-ec = { version = "0.4", optional = true }
ark-ff = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }
ark-crypto-primitives = { version = "0.4", optional = true }
# Settlement deps — alloy for live Ethereum RPC interaction
# NOTE: alloy ≥1.7 requires rustc ≥1.91, so the ethereum-live feature is
# exempted from the MSRV 1.88 check. The CI runs ethereum-live tests only
# with the latest stable toolchain, not with MSRV.
alloy = { version = "2", optional = true, features = [
    "provider-ws", "provider-http", "signers", "signer-local",
    "contract", "network", "essentials",
] }
# Bitcoin Core RPC client (feature-gated: bitcoin-live)
bitcoincore-rpc = { version = "0.19", optional = true }
# HTTP client for Celestia DA layer integration (feature-gated)
reqwest = { version = "0.12", optional = true, features = ["json"] }
serde_json = { version = "1.0", optional = true }
# Common (always available)
async-trait = "0.1"
tokio = { version = "1.35", features = ["sync", "macros", "rt", "time"] }
blake3 = "1.5"
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", features = ["alloc"] }
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
hex = "0.4"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }

[features]
default = []
arkworks = [
    "dep:ark-ff", "dep:ark-ec", "dep:ark-serialize", "dep:ark-groth16",
    "dep:ark-bn254", "dep:ark-relations", "dep:ark-r1cs-std", "dep:ark-snark",
    "dep:ark-crypto-primitives", "dep:rand", "dep:rand_chacha",
]
ethereum-live = ["dep:alloy"]
bitcoin-live = ["dep:bitcoincore-rpc", "dep:serde_json"]
settlement-ffi = []
cosmos = []
ceremony = []
celestia = ["dep:reqwest", "dep:serde_json"]
# INSECURE: only enable for tests or single-party trusted setups.
# Derives Phase 2 toxic waste from the (public) SRS transcript, which is
# forgeable by anyone with the transcript. Production MUST use a real MPC.
unsafe-phase2-deterministic = []

[build-dependencies]
rustc_version = "0.4"
semver = "1.0"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Benchmarks have been consolidated into the omnia-benches crate
# (benches/ directory at workspace root)

[[example]]
name = "bitcoin_regtest_e2e"
required-features = ["bitcoin-live"]

[[example]]
name = "bitcoin_testnet4_verify"
required-features = ["bitcoin-live"]

[[example]]
name = "bitcoin_testnet4_finality_verify"
required-features = ["bitcoin-live"]
