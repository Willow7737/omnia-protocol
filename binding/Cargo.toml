[package]
name = "omnia-binding"
version = "0.1.0"
edition = "2021"
authors = ["Omnia Protocol Contributors"]
description = "Layer 3: The Binding Layer — Cryptographic self-proof for physical reality (RF fingerprinting, quantum-resistant commitments, provenance log)"
license = "CC0-1.0"
repository = "https://github.com/Willow7737/omnia-protocol"

[dependencies]
omnia-substrate = { path = "../substrate" }
omnia-shards = { path = "../shards" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1"
blake3 = "1.5"
thiserror = "2.0"
tracing = "0.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
pqc_dilithium = "0.2"
rand = "0.8"
serde_bytes = "0.11"

[dev-dependencies]
tokio-test = "0.4"
rand = "0.8"
