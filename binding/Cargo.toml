[package]
name = "omnia-binding"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Layer 3: The Binding Layer — Cryptographic self-proof for physical reality (RF fingerprinting, quantum-resistant commitments, provenance log)"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
omnia-substrate = { path = "../substrate" }
omnia-shards = { path = "../shards" }
omnia-primitives = { path = "../omnia-primitives" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
blake3 = "1.5"
thiserror = "2.0"
tracing = "0.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
pqc_dilithium = "0.2"
rand = "0.8"
serde_bytes = "0.11"
subtle = "2"
hex = "0.4"
ml-kem = { version = "0.2", features = ["zeroize"] }

[dev-dependencies]
tokio-test = "0.4"
rand = "0.8"
tempfile = "3"
