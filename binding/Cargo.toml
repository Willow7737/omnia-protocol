[package]
name = "omnia-binding"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Layer 3: The Binding Layer — Cryptographic self-proof for physical reality (RF fingerprinting, quantum-resistant commitments, provenance log)"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
omnia-substrate = { path = "../substrate", default-features = false }
omnia-shards = { path = "../shards" }
omnia-primitives = { path = "../omnia-primitives" }
omnia-crypto = { path = "../omnia-crypto", features = ["keystore"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
blake3 = "1.5"
thiserror = "2.0"
tracing = "0.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
pqc_dilithium = { version = "0.2", optional = true }
rand = "0.8"
serde_bytes = "0.11"
subtle = "2"
hex = "0.4"
ml-kem = { version = "0.2", features = ["zeroize"], optional = true }
base64 = "0.22"

[features]
default = []
pqc = ["dep:pqc_dilithium", "dep:ml-kem"]
# Exposes simulator-only RF helpers for integration tests and local development.
# Do not enable for production builds.
test-utils = []

[dev-dependencies]
tokio-test = "0.4"
rand = "0.8"
tempfile = "3"
