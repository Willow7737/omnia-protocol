[package]
name = "omnia-substrate"
version = "0.1.0"
edition = "2021"
authors = ["Omnia Protocol Contributors"]
description = "Layer 1: The Substrate — Causal graph consensus, vector clocks, CRDTs, and gossip protocol"
license = "CC0-1.0"
repository = "https://github.com/Willow7737/omnia-protocol"
rust-version = "1.75"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# FIX 1: Real bincode for compact binary serialization
bincode = "1.3"

# FIX 2: Ed25519 signatures
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"

# FIX 4: Async runtime and libp2p networking
tokio = { version = "1.35", features = ["full"] }
libp2p = { version = "0.53", features = ["quic", "kad", "gossipsub", "mdns", "noise", "yamux", "tcp", "dns", "macros", "request-response"] }
futures = "0.3"
async-trait = "0.1"
blake3 = "1.5"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

# FIX 6: Property-based testing
proptest = "1.4"

[[bench]]
name = "throughput"
harness = false
