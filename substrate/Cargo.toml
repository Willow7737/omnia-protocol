[package]
name = "omnia-substrate"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Layer 1: The Substrate — Causal graph consensus, vector clocks, CRDTs, and gossip protocol"
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }

[dependencies]
omnia-primitives = { path = "../omnia-primitives" }
omnia-crypto = { path = "../omnia-crypto", default-features = false, features = ["keystore"] }
omnia-consensus = { path = "../omnia-consensus", features = ["persistent-storage"] }
omnia-network = { path = "../omnia-network", default-features = false, optional = true }
omnia-adapters = { path = "../omnia-adapters", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
thiserror = "2.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Compact binary serialization — postcard replaces unmaintained bincode (RUSTSEC-2025-0141)
postcard = { version = "1", features = ["alloc"] }

# FIX 2: Ed25519 signatures
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"

# FIX 4: Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
blake3 = "1.5"
futures = "0.3"

# AES-256-GCM authenticated encryption for keystore
aes-gcm = "0.10"

# BIP-39 mnemonic support for keystore
bip39 = { version = "2", features = ["zeroize", "rand"] }

# HKDF key derivation for keystore
hkdf = "0.12"
serde_json = "1.0"

# Embedded key-value store for persistent slashing state
# redb is a pure-Rust, ACID-compliant, simple embedded database.
redb = "2"

# BLS12-381 signature aggregation — reduces N signature verifications to 1
# Spec: Boneh-Lynn-Shacham (BLS) signatures
blst = { version = "0.3", optional = true }

# Efficient serialization of byte arrays in serde — needed for BLS key/sig binary fields
serde_bytes = { version = "0.11", optional = true }

# Constant-time comparisons for cryptographic operations — prevents timing side-channels
subtle = "2"

# Cryptographic random number generation — needed for secure round seed generation
getrandom = "0.2"

# Snappy compression for gossip messages — reduces bandwidth by 50-80%
snap = { version = "1", optional = true }

# Legacy sled database support for one-time migration to redb
sled = { version = "0.34", optional = true }

# bincode 1.x for legacy wire format deserialization (v0 fallback)
bincode = { workspace = true }

[features]
default = []
migration = ["sled"]
bls = ["omnia-crypto/bls", "dep:blst", "dep:serde_bytes"]
pqc = ["omnia-crypto/pqc"]
persistent-storage = ["omnia-consensus/persistent-storage"]
network = ["dep:omnia-network", "omnia-network/network", "dep:snap"]
zk = ["dep:omnia-adapters", "omnia-adapters/arkworks"]
ethereum-live = ["dep:omnia-adapters", "omnia-adapters/ethereum-live"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
libp2p = { version = "0.56", features = ["quic", "kad", "gossipsub", "mdns", "noise", "yamux", "tcp", "dns", "macros", "request-response", "cbor", "tokio", "autonat", "relay", "dcutr"] }

# FIX 6: Property-based testing
proptest = "1.4"

# sled is needed for integration tests of migration utility
sled = "0.34"

# Benchmarks have been consolidated into the omnia-benches crate
# (benches/ directory at workspace root)
