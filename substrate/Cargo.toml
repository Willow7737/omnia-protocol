[package]
name = "omnia-substrate"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Layer 1: The Substrate — Causal graph consensus, vector clocks, CRDTs, and gossip protocol"
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Compact binary serialization — postcard replaces unmaintained bincode (RUSTSEC-2025-0141)
postcard = { version = "1", features = ["alloc"] }

# FIX 2: Ed25519 signatures
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"

# FIX 4: Async runtime and libp2p networking
tokio = { version = "1.35", features = ["full"] }
libp2p = { version = "0.56", features = ["quic", "kad", "gossipsub", "mdns", "noise", "yamux", "tcp", "dns", "macros", "request-response", "cbor", "tokio"] }
futures = "0.3"
async-trait = "0.1"
blake3 = "1.5"

# AES-256-GCM authenticated encryption for keystore
aes-gcm = "0.10"

# HKDF key derivation for keystore
hkdf = "0.12"
serde_json = "1.0"

# Embedded key-value store for persistent slashing state
# redb is a pure-Rust, ACID-compliant, simple embedded database.
redb = "2"

# BLS12-381 signature aggregation — reduces N signature verifications to 1
# Spec: Boneh-Lynn-Shacham (BLS) signatures
blst = "0.3"

# Efficient serialization of byte arrays in serde — needed for BLS key/sig binary fields
serde_bytes = "0.11"

# Constant-time comparisons for cryptographic operations — prevents timing side-channels
subtle = "2"

# Cryptographic random number generation — needed for secure round seed generation
getrandom = "0.2"

# Legacy sled database support for one-time migration to redb
sled = { version = "0.34", optional = true }

[features]
default = []
migration = ["sled"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

# FIX 6: Property-based testing
proptest = "1.4"

# sled is needed for integration tests of migration utility
sled = "0.34"

# bincode 1.x for legacy wire format deserialization (v0 fallback)
bincode = { workspace = true }

[[bench]]
name = "throughput"
harness = false
