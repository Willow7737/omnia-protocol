[package]
name = "omnia-economics"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Layer 5: Economics — Universal Basic Compute token, Proof-of-Useful-Work, and Quadratic Voting with Reputation Decay"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
omnia-substrate = { path = "../substrate", default-features = false }
omnia-primitives = { path = "../omnia-primitives" }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2.0"
tracing = "0.1"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"

[features]
default = []
production = []
