[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
ignore = [
    # RUSTSEC-2024-0384: instant — unmaintained, transitive dep via sled
    # Review by: 2026-09-01 — sled is optional (migration feature only); remove once sled→redb migration is complete
    "RUSTSEC-2024-0384",
    # RUSTSEC-2024-0388: derivative — unmaintained, transitive dep via arkworks
    # Review by: 2026-09-01 — check if arkworks has removed derivative dependency
    "RUSTSEC-2024-0388",
    # RUSTSEC-2024-0436: paste — unmaintained, transitive dep via netlink-packet-core
    # Review by: 2026-09-01 — check if netlink crates have dropped paste proc-macro
    "RUSTSEC-2024-0436",
    # RUSTSEC-2024-0437: protobuf <3.7.2 uncontrolled recursion — pinned at 2.x by libp2p transitives
    # Review by: 2026-09-01 — check if libp2p has migrated to protobuf 3.x+
    "RUSTSEC-2024-0437",
    # RUSTSEC-2025-0055: tracing-subscriber ANSI escape injection — patched at 0.3.23 (>=0.3.20)
    # Review by: 2026-09-01 — verify still at patched version; remove if cargo-deny stops flagging
    "RUSTSEC-2025-0055",
    # RUSTSEC-2025-0057: ring — unmaintained audit classification, no fix available
    # Review by: 2026-11-01 — ring is actively maintained; upstream RUSTSEC classification dispute
    "RUSTSEC-2025-0057",
    # RUSTSEC-2025-0141: bincode v1 — unmaintained, transitive dep via ark-serialize; direct deps use bincode v3
    # Review by: 2026-09-01 — check if ark-serialize has migrated off bincode v1
    "RUSTSEC-2025-0141",
    # RUSTSEC-2026-0118: hickory-proto NSEC3 unbounded loop — pinned at 0.25.x by libp2p, fix needs 0.26+
    # Review by: 2026-09-01 — check if libp2p has upgraded to hickory-proto 0.26+
    "RUSTSEC-2026-0118",
    # RUSTSEC-2026-0119: hickory-proto O(n^2) name compression — pinned at 0.25.x by libp2p, fix needs 0.26+
    # Review by: 2026-09-01 — check if libp2p has upgraded to hickory-proto 0.26+
    "RUSTSEC-2026-0119",
]

[licenses]
allow = [
    "CC0-1.0",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",     # Used by ICU crates (icu_collections, icu_normalizer, etc.)
    "NCSA",            # Used by libfuzzer-sys
]

[[licenses.clarify]]
name = "omnia-fuzz"
expression = "CC0-1.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "warn"   # workspace-internal path deps lack version keys — not a real risk
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
