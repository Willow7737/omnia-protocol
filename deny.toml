[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
ignore = [
    "RUSTSEC-2024-0388",  # derivative — unmaintained, transitive dep via arkworks
    "RUSTSEC-2024-0436",  # paste — unmaintained, transitive dep via netlink-packet-core
]

[licenses]
allow = [
    "CC0-1.0",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
]
# Deny all licenses not in the allow list (replaces removed unlicensed/default keys)
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
