[advisories]
unmaintained = "workspace"
# CI-failure mitigation (audit v0.1.68 follow-up): bitcoin-io 0.1.100 and
# bitcoin_hashes 0.14.100 were yanked on crates.io but are still pulled in
# transitively via bip39 (keystore) and secp256k1 (ethereum-live adapter).
# Yanked crates are not security vulnerabilities — they're just removed from
# the index for new resolves. Setting `yanked = "warn"` lets CI pass while
# still surfacing the issue. Revert to "deny" once upstream republishes.
yanked = "warn"
ignore = [
    # RUSTSEC-2024-0384: instant crate (unmaintained) — pulled in by parking_lot 0.11.x via parking_lot_core 0.8.x
    # sled was removed in Phase 2 but instant remains in the tree via parking_lot 0.11.x
    # Upstream: parking_lot 0.12.x removed the instant dependency; upgrading would resolve this
    # Risk: Unmaintained but no known exploitable vulnerability — instant is a time abstraction shim
    # Mitigation: Only used on wasm32 targets as a polyfill; no impact on native builds
    # Review date: 2027-03-01
    "RUSTSEC-2024-0384",

    # RUSTSEC-2025-0055: tracing-subscriber 0.2.x (ANSI escape injection) — pulled in by ark-relations via arkworks
    # NOTE: tracing-subscriber 0.3.23 is also in the tree (omnia's direct dep) which is not affected
    # Upstream: arkworks hasn't upgraded to tracing-subscriber 0.3+; see https://github.com/arkworks-rs/algebra/issues/610
    # Risk: Low severity — ANSI escape injection in logs; only affects terminal output rendering
    # Mitigation: omnia-node uses tracing-subscriber 0.3.x directly; 0.2.x only used in arkworks test/debug paths
    # Review date: 2027-03-01
    "RUSTSEC-2025-0055",

    # RUSTSEC-2024-0388: derivative crate (unmaintained) — pulled in transitively by arkworks (ark-ec, ark-ff, etc.)
    # Upstream: https://github.com/arkworks-rs/algebra/issues/610
    # Risk: Unmaintained but no known exploitable vulnerability — derivative is a derive macro only
    # Mitigation: No runtime impact; macro only runs at compile time
    # Review date: 2027-03-01
    "RUSTSEC-2024-0388",

    # RUSTSEC-2024-0436: paste crate (unmaintained) — pulled in transitively via netlink (via libp2p)
    # Upstream: No known fix; paste is a proc-macro crate
    # Risk: Unmaintained but no known exploitable vulnerability — paste is a proc-macro only
    # Mitigation: No runtime impact; macro only runs at compile time
    # Review date: 2027-03-01
    "RUSTSEC-2024-0436",

    # RUSTSEC-2024-0437: protobuf 2.x (unmaintained) — pulled in transitively by libp2p
    # Upstream: libp2p 0.56+ may have migrated; check on next upgrade
    # Risk: Unmaintained; protobuf deserialization could have edge cases
    # Mitigation: GossipSub payload size limits prevent unbounded deserialization
    # Review date: 2027-03-01
    "RUSTSEC-2024-0437",

    # RUSTSEC-2025-0057: ring (disputed classification) — classification as vulnerability is disputed
    # Upstream: https://github.com/briansmith/ring/issues/2427
    # Risk: Disputed — not a practical vulnerability in Omnia's usage
    # Mitigation: ring used only for TLS noise handshake via libp2p; no direct usage
    # Review date: 2027-03-01
    "RUSTSEC-2025-0057",

    # RUSTSEC-2025-0141: bincode v1 (unmaintained) — pulled in by ark-serialize
    # Upstream: arkworks plans migration to postcard/bincode v2
    # Risk: Unmaintained but no known exploitable vulnerability
    # Mitigation: bincode only used for ZK proof serialization; not exposed to untrusted input
    # Review date: 2027-03-01
    "RUSTSEC-2025-0141",

    # RUSTSEC-2026-0118: hickory-proto NSEC3 hash denial-of-service — pinned by libp2p
    # Upstream: libp2p 0.56+ may have updated hickory; check on next upgrade
    # Risk: DoS via crafted DNS responses; mitigated by not using hickory for external DNS
    # Mitigation: libp2p uses hickory for DNS resolution only; no external DNS in production config
    # Review date: 2027-03-01
    "RUSTSEC-2026-0118",

    # RUSTSEC-2026-0119: hickory-proto compression denial-of-service — pinned by libp2p
    # Upstream: Same as RUSTSEC-2026-0118; check on libp2p upgrade
    # Risk: DoS via crafted DNS messages; mitigated by not using external DNS
    # Mitigation: libp2p uses hickory for DNS resolution only; no external DNS in production config
    # Review date: 2027-03-01
    "RUSTSEC-2026-0119",

    # RUSTSEC-2026-0173: proc-macro-error2 (unmaintained) — pulled in transitively
    # via alloy-sol-macro (Ethereum settlement adapter).
    # Upstream: https://github.com/rust-lang/cargo/issues/14677 (proc-macro-error2 fork)
    # Risk: Unmaintained but no known exploitable vulnerability — proc-macro only
    # Mitigation: No runtime impact; macro only runs at compile time
    # Review date: 2027-03-01
    "RUSTSEC-2026-0173",
]

[licenses]
allow = [
    "CC0-1.0",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",     # Used by ICU crates (icu_collections, icu_normalizer, etc.)
    "NCSA",            # Used by libfuzzer-sys
]

[[licenses.clarify]]
name = "omnia-fuzz"
expression = "CC0-1.0"
license-files = []

[[licenses.clarify]]
name = "omnia-benches"
expression = "CC0-1.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "warn"   # workspace-internal path deps lack version keys — not a real risk
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
