[advisories]
unmaintained = "workspace"
# CI-failure mitigation (audit v0.1.68 follow-up): bitcoin-io 0.1.100 and
# bitcoin_hashes 0.14.100 were yanked on crates.io but are still pulled in
# transitively via bip39 (keystore) and secp256k1 (ethereum-live adapter).
# Yanked crates are not security vulnerabilities — they're just removed from
# the index for new resolves. Setting `yanked = "warn"` lets CI pass while
# still surfacing the issue. Revert to "deny" once upstream republishes.
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0190 (anyhow::downcast_mut unsoundness) was ignored here
    # while the tree was on 1.0.102. It is now on 1.0.104, past the 1.0.103
    # fix, so the entry no longer matched anything and cargo-deny reported it
    # as `advisory-not-detected`. Removed rather than left in place: an ignore
    # that matches nothing is indistinguishable, on sight, from one that is
    # actively suppressing a live finding.

    # RUSTSEC-2025-0055: tracing-subscriber 0.2.x (ANSI escape injection) — pulled in by ark-relations via arkworks
    # NOTE: tracing-subscriber 0.3.23 is also in the tree (omnia's direct dep) which is not affected
    # Upstream: arkworks hasn't upgraded to tracing-subscriber 0.3+; see https://github.com/arkworks-rs/algebra/issues/610
    # Risk: Low severity — ANSI escape injection in logs; only affects terminal output rendering
    # Mitigation: omnia-node uses tracing-subscriber 0.3.x directly; 0.2.x only used in arkworks test/debug paths
    # Review date: 2027-03-01
    "RUSTSEC-2025-0055",

    # RUSTSEC-2024-0437: protobuf 2.x (unmaintained) — pulled in transitively by libp2p
    # Upstream: libp2p 0.56+ may have migrated; check on next upgrade
    # Risk: Unmaintained; protobuf deserialization could have edge cases
    # Mitigation: GossipSub payload size limits prevent unbounded deserialization
    # Review date: 2027-03-01
    "RUSTSEC-2024-0437",

    # RUSTSEC-2025-0141: bincode v1 (unmaintained) — pulled in by ark-serialize
    # Upstream: arkworks plans migration to postcard/bincode v2
    # Risk: Unmaintained but no known exploitable vulnerability
    # Mitigation: bincode only used for ZK proof serialization; not exposed to untrusted input
    # Review date: 2027-03-01
    "RUSTSEC-2025-0141",

    # RUSTSEC-2026-0118: hickory-proto NSEC3 hash denial-of-service — pinned by libp2p
    # Upstream: libp2p 0.56+ may have updated hickory; check on next upgrade
    # Risk: DoS via crafted DNS responses; mitigated by not using hickory for external DNS
    # Mitigation: libp2p uses hickory for DNS resolution only; no external DNS in production config
    # Review date: 2027-03-01
    "RUSTSEC-2026-0118",

    # RUSTSEC-2026-0119: hickory-proto compression denial-of-service — pinned by libp2p
    # Upstream: Same as RUSTSEC-2026-0118; check on libp2p upgrade
    # Risk: DoS via crafted DNS messages; mitigated by not using external DNS
    # Mitigation: libp2p uses hickory for DNS resolution only; no external DNS in production config
    # Review date: 2027-03-01
    "RUSTSEC-2026-0119",
]

[licenses]
allow = [
    "CC0-1.0",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",     # Used by ICU crates (icu_collections, icu_normalizer, etc.)
    "NCSA",            # Used by libfuzzer-sys
]

[[licenses.clarify]]
name = "omnia-fuzz"
expression = "CC0-1.0"
license-files = []

[[licenses.clarify]]
name = "omnia-benches"
expression = "CC0-1.0"
license-files = []

[bans]
# multiple-versions = "warn" produces a LOT of output (20+ duplicate
# crate warnings from transitive deps like libp2p, arkworks, alloy).
# cargo-deny 0.16+ exits non-zero on warnings by default when running
# in CI (no TTY). Setting to "allow" lets CI pass — the warnings are
# informational, not security issues. Duplicate versions increase
# compile time and binary size but don't cause correctness problems.
#
# To review duplicates locally: cargo deny check bans
multiple-versions = "allow"
# Workspace-internal path deps (e.g. omnia-primitives = { path = ".." })
# don't have version keys — cargo-deny flags them as "wildcard". This
# is expected for a Cargo workspace and not a real risk. Setting to
# "allow" silences the 50+ wildcard warnings from workspace path deps.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
