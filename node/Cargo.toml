[package]
name = "omnia-node"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Omnia node binary — runs a full node with REST API, consensus, slashing, shard routing, and economics"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
# Workspace crate dependencies — each provides a distinct protocol layer
omnia-substrate = { path = "../substrate", default-features = false }   # Layer 1: causal graph consensus, slashing, gossip
omnia-primitives = { path = "../omnia-primitives" }  # Shared types: Event, VectorClock, wire format
omnia-shards = { path = "../shards" }         # Layer 2: domain shard routing and fee enforcement
omnia-economics = { path = "../economics" }   # Layer 5: UBC token, governance, useful-work rewards
omnia-binding = { path = "../binding" }       # Layer 3: physical-digital binding layer
omnia-network = { path = "../omnia-network", default-features = false, optional = true }  # P2P networking layer
omnia-adapters = { path = "../omnia-adapters", default-features = false } # ZK-rollup settlement adapters (required for SettlementAdapter trait)
omnia-crypto = { path = "../omnia-crypto", default-features = false, optional = true }     # Crypto primitives (for light mode keygen)

# Async runtime — needed for all async I/O, signal handling, and task spawning
tokio = { version = "1", features = ["full", "signal"] }

# CLI argument parsing with env var overrides — allows node_id=1 OMNIA_NODE_ID=2
clap = { version = "4", features = ["derive", "env"] }

# Structured logging — tracing is the Rust standard for instrumented applications
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }  # JSON output + env-filter

# Lightweight HTTP framework — ideal for health/metrics/API endpoints
axum = "0.7"

# Serialization — Serde is the universal Rust serialization framework
serde = { version = "1", features = ["derive"] }
serde_json = "1"  # JSON serialization for API request/response bodies

# Prometheus metrics exposition — industry standard for monitoring
prometheus = { version = "0.13", optional = true }

# Ergonomic error handling — anyhow::Result with context chaining
anyhow = "1"

# Structured error types — thiserror derives Display and Error
thiserror = "2"

# JWT creation and validation — industry-standard HMAC-SHA256 tokens
jsonwebtoken = "10"

# Tower middleware for HTTP concerns (CORS, etc.)
tower-http = { version = "0.6", features = ["cors"] }

# Embedded database for persistent nonce and slashing state — redb provides
# fast, ACID-compliant key-value storage used by RedbNonceStore and RedbSlashingStore.
# redb is pure Rust, stable, and production-ready.
redb = "2"

# Hex encoding for event IDs and node identifiers in JSON responses
hex = "0.4"

# AES-256-GCM authenticated encryption for encrypting private key files
aes-gcm = "0.10"

# BLAKE3 hash for key derivation from passphrase
blake3 = "1.5"

# Secure memory zeroization for key material cleanup
zeroize = { version = "1", features = ["derive"] }

# Cryptographic random number generation for nonce generation
rand = "0.8"

# TOML configuration file parsing — industry-standard format for node configuration
toml = "0.8"

# Compact binary serialization for genesis block files
postcard = { version = "1", features = ["alloc"] }

# Timestamp handling for API responses
chrono = { version = "0.4", features = ["serde"] }

# UUID generation for event and proposal identifiers
uuid = { version = "1", features = ["v4"] }

# HTTP client for ceremony server communication
reqwest = { version = "0.12", features = ["json"], optional = true }

# OpenAPI spec generation — auto-documents all REST endpoints
utoipa = "5"
# Swagger UI embeds ~11MB of JS/CSS assets into the binary.
# Make it optional so release builds can omit it and meet the ≤12MB target.
# Enable with --features swagger-ui for development.
utoipa-swagger-ui = { version = "8", features = ["axum"], optional = true }  # Interactive API docs UI

[features]
default = ["full"]
full = ["network", "zk", "bls", "pqc", "metrics"]
light = []  # no networking, no ZK, no heavy crypto
metrics = ["dep:prometheus"]
swagger-ui = ["dep:utoipa-swagger-ui"]
network = ["omnia-network/network", "omnia-substrate/network", "dep:omnia-network"]
zk = ["omnia-adapters/arkworks", "omnia-substrate/zk", "dep:reqwest"]
bls = ["omnia-crypto/bls", "omnia-substrate/bls", "dep:omnia-crypto"]
pqc = ["omnia-crypto/pqc", "omnia-substrate/pqc", "dep:omnia-crypto"]
ethereum-live = ["omnia-adapters/ethereum-live", "zk"]
# Docker Compose E2E test — requires Docker daemon and ports 9090–9094.
# Run with: cargo test -p omnia-node --test docker_compose_e2e --features docker-tests
docker-tests = []

[dev-dependencies]
# HTTP client for integration tests
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
utoipa = "5"
# Tower ServiceExt for oneshot testing of axum routers
tower = { version = "0.5", features = ["util"] }
# http-body for reading response bodies in tests
http-body-util = "0.1"
