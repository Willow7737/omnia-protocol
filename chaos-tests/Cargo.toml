[package]
name = "omnia-chaos-tests"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Chaos testing framework for the Omnia Protocol — simulates network partitions, node crashes, message loss, and Byzantine behavior"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
omnia-substrate = { path = "../substrate" }
omnia-shards = { path = "../shards" }
omnia-economics = { path = "../economics" }
# BLAKE3 hash for deriving node IDs from public keys (matches Event::sign_with_keypair)
blake3 = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rand = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
hex = "0.4"

[dev-dependencies]
tracing-subscriber = "0.3"
