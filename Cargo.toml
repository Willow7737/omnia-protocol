[workspace]
members = [
    "omnia-primitives",
    "omnia-crypto",
    "omnia-consensus",
    "substrate",
    "shards",
    "binding",
    "economics",
    "zk",
    "node",
    "chaos-tests",
    "fuzz",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Omnia Protocol Contributors"]
license = "CC0-1.0"
repository = "https://github.com/Willow7737/omnia-protocol"
rust-version = "1.88"

[workspace.dependencies]
# bincode 1.x for legacy wire format deserialization (v0 fallback)
bincode = "1"
