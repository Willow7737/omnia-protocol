[workspace]
members = [
    "omnia-primitives",
    "omnia-crypto",
    "omnia-consensus",
    "omnia-network",
    "omnia-adapters",
    "substrate",
    "shards",
    "binding",
    "economics",
    "node",
    "chaos-tests",
    "fuzz",
    "benches",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Omnia Protocol Contributors"]
license = "CC0-1.0"
repository = "https://github.com/Willow7737/omnia-protocol"
rust-version = "1.91.0"

[workspace.dependencies]
# bincode 1.x for legacy wire format deserialization (v0 fallback)
bincode = "1"

# Release profile optimization — Decision 3: panic = "abort"
# Fat LTO provides maximum dead-code elimination and cross-crate inlining
# to meet the ≤12MB binary size target. Compile time is longer but
# acceptable for release builds.
# codegen-units = 1 maximizes optimization opportunities
[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false

# Bench profile inherits release but keeps debug info for profiling
[profile.bench]
inherits = "release"
debug = true
strip = false
