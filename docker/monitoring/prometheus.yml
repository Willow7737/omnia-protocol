global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'omnia-bootstrap'
    static_configs:
      - targets: ['omnia-bootstrap:9090']
    metrics_path: /metrics

  - job_name: 'omnia-nodes'
    static_configs:
      - targets:
        - 'omnia-node-1:9091'
        - 'omnia-node-2:9092'
        - 'omnia-node-3:9093'
        - 'omnia-node-4:9094'
    metrics_path: /metrics
