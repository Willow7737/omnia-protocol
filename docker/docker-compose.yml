services:
  omnia-bootstrap:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: omnia-bootstrap
    environment:
      - RUST_LOG=info
      - OMNIA_NODE_ID=1
      - OMNIA_BOOTSTRAP_NODES=
      - OMNIA_LISTEN_ADDR=/ip4/0.0.0.0/udp/4001/quic-v1
      - OMNIA_HTTP_PORT=8080
      - OMNIA_DATA_DIR=/app/data
      - OMNIA_TOTAL_NODES=5
      - OMNIA_CORS_ORIGINS=*
      - OMNIA_JWT_SECRET=${OMNIA_JWT_SECRET:-omnia-testnet-jwt-secret-CHANGE-ME}
      - OMNIA_AUTHORIZED_CALLERS=admin-caller
    ports:
      - "9090:8080/tcp"
    networks:
      - omnia-testnet
    volumes:
      - bootstrap-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Worker nodes dial the bootstrap by DNS name. The address may be given
  # with or without a trailing `/p2p/<PeerId>` component:
  #   - without: the peer identity is learned during the QUIC handshake
  #   - with:    the identity is verified against the pinned PeerId; since
  #              the node derives its libp2p identity from the persistent
  #              keypair in its data volume, the PeerId is stable across
  #              restarts and safe to pin
  omnia-node-1:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: omnia-node-1
    environment:
      - RUST_LOG=info
      - OMNIA_NODE_ID=2
      - OMNIA_BOOTSTRAP_NODES=/dns4/omnia-bootstrap/udp/4001/quic-v1
      - OMNIA_LISTEN_ADDR=/ip4/0.0.0.0/udp/4001/quic-v1
      - OMNIA_HTTP_PORT=8080
      - OMNIA_DATA_DIR=/app/data
      - OMNIA_TOTAL_NODES=5
      - OMNIA_CORS_ORIGINS=*
      - OMNIA_JWT_SECRET=${OMNIA_JWT_SECRET:-omnia-testnet-jwt-secret-CHANGE-ME}
      - OMNIA_AUTHORIZED_CALLERS=admin-caller
    ports:
      - "9091:8080/tcp"
    networks:
      - omnia-testnet
    volumes:
      - node1-data:/app/data
    depends_on:
      omnia-bootstrap:
        condition: service_healthy

  omnia-node-2:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: omnia-node-2
    environment:
      - RUST_LOG=info
      - OMNIA_NODE_ID=3
      - OMNIA_BOOTSTRAP_NODES=/dns4/omnia-bootstrap/udp/4001/quic-v1
      - OMNIA_LISTEN_ADDR=/ip4/0.0.0.0/udp/4001/quic-v1
      - OMNIA_HTTP_PORT=8080
      - OMNIA_DATA_DIR=/app/data
      - OMNIA_TOTAL_NODES=5
      - OMNIA_CORS_ORIGINS=*
      - OMNIA_JWT_SECRET=${OMNIA_JWT_SECRET:-omnia-testnet-jwt-secret-CHANGE-ME}
      - OMNIA_AUTHORIZED_CALLERS=admin-caller
    ports:
      - "9092:8080/tcp"
    networks:
      - omnia-testnet
    volumes:
      - node2-data:/app/data
    depends_on:
      omnia-bootstrap:
        condition: service_healthy

  omnia-node-3:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: omnia-node-3
    environment:
      - RUST_LOG=info
      - OMNIA_NODE_ID=4
      - OMNIA_BOOTSTRAP_NODES=/dns4/omnia-bootstrap/udp/4001/quic-v1
      - OMNIA_LISTEN_ADDR=/ip4/0.0.0.0/udp/4001/quic-v1
      - OMNIA_HTTP_PORT=8080
      - OMNIA_DATA_DIR=/app/data
      - OMNIA_TOTAL_NODES=5
      - OMNIA_CORS_ORIGINS=*
      - OMNIA_JWT_SECRET=${OMNIA_JWT_SECRET:-omnia-testnet-jwt-secret-CHANGE-ME}
      - OMNIA_AUTHORIZED_CALLERS=admin-caller
    ports:
      - "9093:8080/tcp"
    networks:
      - omnia-testnet
    volumes:
      - node3-data:/app/data
    depends_on:
      omnia-bootstrap:
        condition: service_healthy

  omnia-node-4:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: omnia-node-4
    environment:
      - RUST_LOG=info
      - OMNIA_NODE_ID=5
      - OMNIA_BOOTSTRAP_NODES=/dns4/omnia-bootstrap/udp/4001/quic-v1
      - OMNIA_LISTEN_ADDR=/ip4/0.0.0.0/udp/4001/quic-v1
      - OMNIA_HTTP_PORT=8080
      - OMNIA_DATA_DIR=/app/data
      - OMNIA_TOTAL_NODES=5
      - OMNIA_CORS_ORIGINS=*
      - OMNIA_JWT_SECRET=${OMNIA_JWT_SECRET:-omnia-testnet-jwt-secret-CHANGE-ME}
      - OMNIA_AUTHORIZED_CALLERS=admin-caller
    ports:
      - "9094:8080/tcp"
    networks:
      - omnia-testnet
    volumes:
      - node4-data:/app/data
    depends_on:
      omnia-bootstrap:
        condition: service_healthy

  # ── Omnia Web Dashboard ───────────────────────────────────────────────
  omnia-web:
    build:
      context: https://github.com/Willow7737/omnia-web.git#main
      dockerfile: Dockerfile
    container_name: omnia-web
    environment:
      # Runtime server-side env vars — used by the API proxy to reach nodes
      # via Docker DNS (not localhost, which refers to the web container itself)
      - OMNIA_NODE_INTERNAL_URLS=http://omnia-bootstrap:8080,http://omnia-node-1:8080,http://omnia-node-2:8080,http://omnia-node-3:8080,http://omnia-node-4:8080
      - OMNIA_API_URL=http://omnia-bootstrap:8080
      # Build-time env vars — baked into the JS bundle at image build time
      - NEXT_PUBLIC_LIVE_MODE=true
      - NEXT_PUBLIC_OMNIA_API_URL=http://localhost:9090
      - NEXT_PUBLIC_POLL_INTERVAL_MS=5000
    ports:
      - "3001:3000"
    networks:
      - omnia-testnet
    depends_on:
      omnia-bootstrap:
        condition: service_healthy
      omnia-node-1:
        condition: service_started
      omnia-node-2:
        condition: service_started
      omnia-node-3:
        condition: service_started
      omnia-node-4:
        condition: service_started
    profiles:
      - web

  prometheus:
    image: prom/prometheus:v2.52.0  # M-23 fix (audit v0.1.68): pin to specific version
    container_name: omnia-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9095:9090"
    networks:
      - omnia-testnet
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.0  # M-23 fix (audit v0.1.68): pin to specific version
    container_name: omnia-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/omnia-node.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../monitoring/grafana/alerts:/etc/grafana/provisioning/alerting:ro
      - grafana-dashboards-provisioning:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    networks:
      - omnia-testnet
    depends_on:
      - prometheus
    profiles:
      - monitoring

networks:
  omnia-testnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  bootstrap-data:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  prometheus-data:
  grafana-data:
  grafana-dashboards-provisioning:
