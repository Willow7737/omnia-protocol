services:
  omnia-bootstrap:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: omnia-bootstrap
    environment:
      - RUST_LOG=info
      - OMNIA_NODE_ID=1
      - OMNIA_BOOTSTRAP_NODES=
      - OMNIA_LISTEN_ADDR=/ip4/0.0.0.0/udp/4001/quic-v1
      - OMNIA_HTTP_PORT=8080
      - OMNIA_DATA_DIR=/app/data
      - OMNIA_TOTAL_NODES=5
      - OMNIA_CORS_ORIGINS=*
    ports:
      - "9090:8080/tcp"
    networks:
      - omnia-testnet
    volumes:
      - bootstrap-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  omnia-node-1:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: omnia-node-1
    environment:
      - RUST_LOG=info
      - OMNIA_NODE_ID=2
      - OMNIA_BOOTSTRAP_NODES=/dns4/omnia-bootstrap/udp/4001/quic-v1
      - OMNIA_LISTEN_ADDR=/ip4/0.0.0.0/udp/4001/quic-v1
      - OMNIA_HTTP_PORT=8080
      - OMNIA_DATA_DIR=/app/data
      - OMNIA_TOTAL_NODES=5
      - OMNIA_CORS_ORIGINS=*
    ports:
      - "9091:8080/tcp"
    networks:
      - omnia-testnet
    volumes:
      - node1-data:/app/data
    depends_on:
      omnia-bootstrap:
        condition: service_healthy

  omnia-node-2:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: omnia-node-2
    environment:
      - RUST_LOG=info
      - OMNIA_NODE_ID=3
      - OMNIA_BOOTSTRAP_NODES=/dns4/omnia-bootstrap/udp/4001/quic-v1
      - OMNIA_LISTEN_ADDR=/ip4/0.0.0.0/udp/4001/quic-v1
      - OMNIA_HTTP_PORT=8080
      - OMNIA_DATA_DIR=/app/data
      - OMNIA_TOTAL_NODES=5
      - OMNIA_CORS_ORIGINS=*
    ports:
      - "9092:8080/tcp"
    networks:
      - omnia-testnet
    volumes:
      - node2-data:/app/data
    depends_on:
      omnia-bootstrap:
        condition: service_healthy

  omnia-node-3:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: omnia-node-3
    environment:
      - RUST_LOG=info
      - OMNIA_NODE_ID=4
      - OMNIA_BOOTSTRAP_NODES=/dns4/omnia-bootstrap/udp/4001/quic-v1
      - OMNIA_LISTEN_ADDR=/ip4/0.0.0.0/udp/4001/quic-v1
      - OMNIA_HTTP_PORT=8080
      - OMNIA_DATA_DIR=/app/data
      - OMNIA_TOTAL_NODES=5
      - OMNIA_CORS_ORIGINS=*
    ports:
      - "9093:8080/tcp"
    networks:
      - omnia-testnet
    volumes:
      - node3-data:/app/data
    depends_on:
      omnia-bootstrap:
        condition: service_healthy

  omnia-node-4:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: omnia-node-4
    environment:
      - RUST_LOG=info
      - OMNIA_NODE_ID=5
      - OMNIA_BOOTSTRAP_NODES=/dns4/omnia-bootstrap/udp/4001/quic-v1
      - OMNIA_LISTEN_ADDR=/ip4/0.0.0.0/udp/4001/quic-v1
      - OMNIA_HTTP_PORT=8080
      - OMNIA_DATA_DIR=/app/data
      - OMNIA_TOTAL_NODES=5
      - OMNIA_CORS_ORIGINS=*
    ports:
      - "9094:8080/tcp"
    networks:
      - omnia-testnet
    volumes:
      - node4-data:/app/data
    depends_on:
      omnia-bootstrap:
        condition: service_healthy

  # ── Omnia Web Dashboard ───────────────────────────────────────────────
  omnia-web:
    build:
      context: https://github.com/Willow7737/omnia-web.git#main
      dockerfile: Dockerfile
    container_name: omnia-web
    environment:
      - NEXT_PUBLIC_OMNIA_API_URL=http://localhost:9090
      - NEXT_PUBLIC_OMNIA_NODE_URLS=http://localhost:9090,http://localhost:9091,http://localhost:9092,http://localhost:9093,http://localhost:9094
      - NEXT_PUBLIC_POLL_INTERVAL_MS=5000
    ports:
      - "3001:3000"
    networks:
      - omnia-testnet
    depends_on:
      omnia-bootstrap:
        condition: service_healthy
    profiles:
      - web

  prometheus:
    image: prom/prometheus:latest
    container_name: omnia-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9095:9090"
    networks:
      - omnia-testnet
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: omnia-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/omnia-node.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../monitoring/grafana/alerts:/etc/grafana/provisioning/alerting:ro
      - grafana-dashboards-provisioning:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    networks:
      - omnia-testnet
    depends_on:
      - prometheus
    profiles:
      - monitoring

networks:
  omnia-testnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  bootstrap-data:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  prometheus-data:
  grafana-data:
  grafana-dashboards-provisioning:
