[package]
name = "omnia-shards"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Layer 2: Domain Shards — Specialized state machines for financial, computational, physical, biological, and identity domains"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
omnia-substrate = { path = "../substrate", default-features = false }
omnia-primitives = { path = "../omnia-primitives" }
omnia-economics = { path = "../economics" }
omnia-crypto = { path = "../omnia-crypto", features = ["keystore"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2.0"
tracing = "0.1"
hex = "0.4"
tokio = { version = "1.35", features = ["sync", "macros", "rt"] }
rand = "0.8"
blake3 = "1.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "3.0", features = ["rand_core", "serde"] }

# Persistent nonce storage — needed for replay protection that survives restarts.
# redb is a pure-Rust, ACID-compliant, simple embedded database that is
# production-ready and cross-platform (works on Linux/macOS/Windows).
redb = "2"

[features]
default = []
# Production mode: enables fail-closed behavior for security-critical
# paths (e.g. cross-shard source_signature verification). Mirrors the
# same feature in economics/Cargo.toml.
production = []
# Real ZK/SNARK proof verification using ark-groth16.
# When disabled (default), proof verification is a no-op placeholder.
real_verification = [
    "dep:ark-groth16",
    "dep:ark-bn254",
    "dep:ark-ec",
    "dep:ark-ff",
    "dep:ark-serialize",
    "dep:ark-snark",
]
# Legacy XOR-based share encryption (v1) — deprecated, for backward compat only.
# Enable only if you need to decrypt v1 shares. Use AES-256-GCM (v2) instead.
legacy-xor-encryption = []

[dependencies.ark-groth16]
version = "0.4"
optional = true

[dependencies.ark-bn254]
version = "0.4"
optional = true

[dependencies.ark-ec]
version = "0.4"
optional = true

[dependencies.ark-ff]
version = "0.4"
optional = true

[dependencies.ark-serialize]
version = "0.4"
optional = true

[dependencies.ark-snark]
version = "0.4"
optional = true

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
proptest = "1"
