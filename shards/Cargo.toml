[package]
name = "omnia-shards"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Layer 2: Domain Shards — Specialized state machines for financial, computational, physical, biological, and identity domains"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
omnia-substrate = { path = "../substrate" }
omnia-economics = { path = "../economics" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1"
thiserror = "2.0"
tracing = "0.1"
hex = "0.4"
tokio = { version = "1.35", features = ["sync", "macros", "rt"] }
rand = "0.8"
blake3 = "1.5"

# Persistent nonce storage — needed for replay protection that survives restarts.
# Sled is chosen for its simplicity, embedded nature (no external DB server),
# and cross-platform compatibility (pure Rust, works on Linux/macOS/Windows).
# ⚠️ sled 0.34 is alpha-quality. Production deployments should migrate to
# rocksdb or redb. See docs/OPERATIONS.md for migration guidance.
sled = "0.34"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
proptest = "1"
