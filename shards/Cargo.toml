[package]
name = "omnia-shards"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Layer 2: Domain Shards — Specialized state machines for financial, computational, physical, biological, and identity domains"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
omnia-substrate = { path = "../substrate" }
omnia-primitives = { path = "../omnia-primitives" }
omnia-economics = { path = "../economics" }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2.0"
tracing = "0.1"
hex = "0.4"
tokio = { version = "1.35", features = ["sync", "macros", "rt"] }
rand = "0.8"
blake3 = "1.5"
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }

# Persistent nonce storage — needed for replay protection that survives restarts.
# redb is a pure-Rust, ACID-compliant, simple embedded database that is
# production-ready and cross-platform (works on Linux/macOS/Windows).
redb = "2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
proptest = "1"
