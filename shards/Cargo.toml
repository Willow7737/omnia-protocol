[package]
name = "omnia-shards"
version = "0.1.0"
edition = "2021"
authors = ["Omnia Protocol Contributors"]
description = "Layer 2: Domain Shards — Specialized state machines for financial, computational, physical, biological, and identity domains"
license = "CC0-1.0"
repository = "https://github.com/Willow7737/omnia-protocol"

[dependencies]
omnia-substrate = { path = "../substrate" }
omnia-economics = { path = "../economics" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1"
thiserror = "2.0"
tracing = "0.1"
hex = "0.4"
tokio = { version = "1.35", features = ["sync", "macros", "rt"] }
rand = "0.8"
blake3 = "1.5"

[dev-dependencies]
tokio-test = "0.4"
