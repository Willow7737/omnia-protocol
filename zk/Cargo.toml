[package]
name = "omnia-zk"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Phase 0: Settlement-agnostic ZK-rollup — Ethereum adapter + Bitcoin/Solana/Celestia stubs"
license = { workspace = true }
repository = { workspace = true }

[features]
default = []
## Enable live Ethereum RPC mode architecture.
## Without this feature, the Ethereum adapter runs in simulated (BLAKE3-based mock) mode.
## Note: The ethers-rs dependency is intentionally excluded from the default build
## to keep compile times and disk usage manageable. To enable full live mode,
## add `ethers = { version = "2", features = ["ws", "rustls"], optional = true }`
## to [dependencies] and change this to `ethereum-live = ["ethers"]`.
ethereum-live = []

[dependencies]
omnia-substrate = { path = "../substrate" }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
blake3 = "1.5"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
async-trait = "0.1"
hex = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-groth16 = "0.4"
ark-snark = "0.4"
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"
ark-crypto-primitives = "0.4"
rand_chacha = "0.3"
rand = "0.8"
serde_bytes = "0.11"
subtle = "2"
# Optional: ethers-rs for live Ethereum settlement (enabled by 'ethereum-live' feature).
# Note: ethers-rs 2.x is very heavy (~300 deps). To use it, add:
#   ethers = { version = "2", features = ["ws", "rustls"], optional = true }
# and uncomment the `ethereum-live = ["ethers"]` feature above.
# Currently, live mode stubs are present but ethers is not included to keep
# build times and disk usage manageable in development.

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "zk_benchmarks"
harness = false
