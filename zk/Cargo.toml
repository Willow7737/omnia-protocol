[package]
name = "omnia-zk"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Phase 0: Settlement-agnostic ZK-rollup — Ethereum adapter + Bitcoin/Solana/Celestia stubs"
license = { workspace = true }
repository = { workspace = true }

[dependencies]
omnia-substrate = { path = "../substrate" }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
blake3 = "1.5"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
async-trait = "0.1"
hex = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-groth16 = "0.4"
ark-snark = "0.4"
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"
ark-crypto-primitives = "0.4"
rand_chacha = "0.3"
rand = "0.8"
serde_bytes = "0.11"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"
