# Omnia Protocol Alert Rules
#
# These alert rules monitor the health and performance of Omnia nodes.
# Deploy alongside the Grafana dashboard for comprehensive observability.

groups:
  - name: omnia-node-alerts
    rules:
      - alert: FinalityStalled
        expr: rate(omnia_node_events_finalized_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
          component: consensus
        annotations:
          summary: "Finality has stalled on {{ $labels.instance }}"
          description: >
            No events have been finalized in the last 5 minutes.
            This may indicate a consensus failure, network partition,
            or insufficient validator participation.
            Check: omnia-node logs, peer connectivity, and slashing events.

      - alert: PeerCountDrop
        expr: omnia_node_peers_connected < 2
        for: 3m
        labels:
          severity: warning
          component: network
        annotations:
          summary: "Peer count critically low on {{ $labels.instance }}"
          description: >
            The node has fewer than 2 connected peers. Consensus requires
            >2/3 of validators to be reachable. A low peer count may
            indicate network issues or misconfigured bootstrap nodes.
            Check: firewall rules, bootstrap node addresses, mDNS discovery.

      - alert: HighSlashingRate
        expr: rate(omnia_slashing_events_total[1h]) > 0.1
        for: 10m
        labels:
          severity: warning
          component: slashing
        annotations:
          summary: "Elevated slashing rate on {{ $labels.instance }}"
          description: >
            More than 0.1 slashing events per hour have been detected.
            This may indicate a misbehaving validator, a software bug,
            or a network partition causing equivocation.
            Check: validator logs, network connectivity, software version.

      - alert: MemoryGrowth
        expr: deriv(process_resident_memory_bytes[1h]) > 10485760
        for: 30m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Sustained memory growth on {{ $labels.instance }}"
          description: >
            Memory usage is growing by more than 10 MiB/hour sustained
            over 30 minutes. This may indicate a memory leak in the
            causal graph, gossip protocol, or sled database.
            Check: causal graph size, event backlog, sled compaction.
