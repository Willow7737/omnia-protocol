# Omnia Protocol Alert Rules
#
# These alert rules monitor the health and performance of Omnia nodes.
# Deploy alongside the Grafana dashboard for comprehensive observability.

groups:
  - name: omnia-node-alerts
    rules:
      - alert: FinalityStalled
        expr: rate(omnia_node_events_finalized_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
          component: consensus
        annotations:
          summary: "No events being finalized"
          description: "The rate of finalized events has been zero for 5 minutes."

      # The threshold is `node_count - 1`: in a healthy mesh every node sees
      # every other one. It is 4 for the current 5-node WAN testnet.
      #
      # RAISE IT WHENEVER THE VALIDATOR SET GROWS. A stale threshold does not
      # error and does not look broken — it just keeps reporting healthy
      # through the degradation it exists to catch. A `< 2` left over from the
      # 3-node topology would stay silent on a 5-node mesh until three of five
      # nodes were gone, long after Lane 0 finality had already halted.
      - alert: PeerCountDrop
        expr: omnia_node_peers_connected < 4
        for: 3m
        labels:
          severity: warning
          component: network
        annotations:
          summary: "Low peer count"
          description: "Connected peers dropped below 4 (expected node_count - 1)."

      - alert: HighSlashingRate
        expr: rate(omnia_slashing_events_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
          component: slashing
        annotations:
          summary: "High slashing rate detected"
          description: "Slashing event rate exceeds 0.1 per second."

      - alert: MemoryGrowth
        expr: deriv(process_resident_memory_bytes[30m]) > 10485760
        for: 30m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Sustained memory growth"
          description: "Memory growing faster than 10MB/min over 30 minutes."
